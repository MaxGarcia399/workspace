<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspace</title>
<!-- WORKSPACE · front nuevo (un agente = una conversación). Generado por web/front/build.py desde web/front/src; no editar a mano. -->
<style>
/* Workspace · front nuevo. Regla de estilo: el color lo pone el personaje (su monito y su rayita); la interfaz va en grises.
   Letra redonda como los monitos. Nada se vuelve a dibujar al elegir: se cambia en su lugar y con transiciones cortas. */
:root{
  --bg:#141416;--rail:#0d0d0f;--panel:#19191c;--card:#202024;--card2:#26262b;--line:#2b2b31;
  --tx:#ededf0;--tx2:#a4a4ad;--tx3:#6f6f78;--ok:#3fbf7f;--warn:#e7a43a;--bad:#ec5a49;
  --sans:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--ease:cubic-bezier(.22,1,.36,1);
  --ac:#ffffff;--acx:#151518;
  /* skills v11: curvas y el iluminado L-1 (en reposo, gris; el color del agente solo en el objeto, la barrita y la flecha) */
  --suave:var(--ease);--sale:cubic-bezier(.4,0,.2,1);--rebote:cubic-bezier(.34,1.56,.64,1);
  --lit-card:#26262b;--lit-tile:#2d2d33;--lit-row:#232327;--lit-row-open:#212125;--lit-tx:#f2f2f5;
  --chip-line:#36363e;--chip-hover:#2a2a30;--bubble-me:#33333a;--borde:#2a2a30
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:6px;border:2px solid var(--bg)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
@keyframes ent{from{opacity:0}}
@keyframes sube{from{transform:translateY(10px) scale(.98);opacity:0}}
@keyframes lat{50%{opacity:.25}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes brillo{to{background-position:-200% 0}}
@keyframes punto{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
@keyframes corre{0%{left:-45%}100%{left:100%}}
@keyframes vaiven{from{left:0}to{left:70%}}
@keyframes tiembla{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes subeH{from{transform:translateY(100%)}}
.mono{display:inline-block;line-height:0}.mono svg{display:block;overflow:visible}

/* ---------- armazón ---------- */
.app{display:grid;grid-template-columns:84px minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);height:100%}

/* ---------- barra de agentes ---------- */
.rail{background:var(--rail);border-right:1px solid #1d1d21;display:flex;flex-direction:column;align-items:center;padding:14px 0 12px;gap:8px;min-height:0}
.rail .lst{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:auto;width:100%;padding:2px 0}
.rail .sep{width:36px;height:1px;background:#26262b;margin:2px 0}
.av7{position:relative;width:72px;padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;border-radius:16px;transition:background-color .15s}
.av7:hover{background:#151518}
.av7 .mono{position:relative;z-index:1}
.av7.on::before{content:"";position:absolute;left:-6px;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.av7.on .mono{filter:drop-shadow(0 7px 9px color-mix(in srgb,var(--c) 42%,transparent))}
.rb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--tx2)}
.rb:hover{background:#1c1c20;color:var(--tx)}
.me{width:38px;height:38px;border-radius:50%;background:#26262b;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--tx2);margin-top:4px}
.tip{position:fixed;padding:6px 11px;border-radius:10px;background:#26262c;border:1px solid #33333a;font-size:12.5px;font-weight:600;pointer-events:none;z-index:50;white-space:nowrap}
.tip small{font-weight:500;color:var(--tx3);margin-left:4px}

/* la rayita: una variación por actividad */
.ray7{position:relative;display:flex;align-items:center;justify-content:center;gap:3px;width:26px;height:5px;margin-top:6px;border-radius:999px;flex:none}
.ray7.r-libre::after{content:"";width:4px;height:4px;border-radius:50%;background:#3a3a42}
.ray7.r-dormido::after{content:"";width:10px;height:3px;border-radius:999px;background:#34343b;animation:lat 3s ease-in-out infinite}
.ray7.r-escribiendo,.ray7.r-leyendo,.ray7.r-enviando,.ray7.r-recibido,.ray7.r-cambiando{background:color-mix(in srgb,var(--c) 20%,#202024);overflow:hidden}
.ray7.r-escribiendo::after{content:"";position:absolute;top:0;bottom:0;width:45%;border-radius:999px;background:var(--c);animation:corre 1.2s ease-in-out infinite}
.ray7.r-leyendo::after,.ray7.r-enviando::after,.ray7.r-recibido::after,.ray7.r-cambiando::after{content:"";position:absolute;top:0;bottom:0;width:30%;border-radius:999px;background:var(--c);animation:vaiven .9s ease-in-out infinite alternate}
.ray7.r-pensando b{width:5px;height:5px;border-radius:50%;background:var(--c);animation:punto 1.2s ease-in-out infinite}
.ray7.r-pensando b:nth-child(2){animation-delay:.16s}.ray7.r-pensando b:nth-child(3){animation-delay:.32s}
.ray7.r-skill{gap:2px;width:30px}
.ray7.r-skill b{flex:1;height:4px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,#202024)}
.ray7.r-skill b.h{background:var(--c)}.ray7.r-skill b.a{background:var(--c);animation:lat 1s ease-in-out infinite}
.ray7.r-espera{background:var(--warn);animation:lat 1.2s ease-in-out infinite}
.ray7.r-listo{width:12px;background:var(--ok);animation:pop .45s var(--ease)}
.ray7.r-error,.ray7.r-cerrado,.ray7.r-no_salio{width:16px;background:var(--bad);animation:tiembla .5s ease-in-out infinite}

/* ---------- centro ---------- */
.mid{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 18px;height:62px;flex:none}
.top #pill{grid-column:2}
.top .der{grid-column:3;justify-self:end}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:#1f1f23;border:1px solid #2b2b31;font-weight:600;transition:background-color .15s;max-width:40vw}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill:hover,.pill.on{background:#2a2a30}
.der{display:flex;gap:8px}
.ghost{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid #2e2e34;font-weight:550;transition:background-color .15s;white-space:nowrap}
.ghost:hover,.ghost.on{background:#24242a}
.ghost .d{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.ghost .d.no{background:#55555e}
.ghost .d.az{background:var(--ac);animation:lat 1s steps(2) infinite}
.cb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--tx2);flex:none;transition:background-color .15s,transform .2s var(--ease)}
.cb:hover{background:#2a2a30;color:var(--tx)}
.cb.send{color:#111}.cb.send:hover{transform:scale(1.06)}
.feed{flex:1;overflow:auto;padding:8px 0 24px;min-height:0}
.col{width:min(760px,100% - 40px);margin:0 auto;display:flex;flex-direction:column;gap:14px}
.when{align-self:center;font-size:12px;color:var(--tx3);margin:6px 0}
.m{max-width:78%;padding:11px 15px;border-radius:20px;white-space:pre-wrap;word-wrap:break-word}
.m.ag{align-self:flex-start;background:var(--card);border-top-left-radius:8px}
.m.yo{align-self:flex-end;background:#33333a;border-top-right-radius:8px}
.m.adj{display:flex;align-items:center;gap:10px;padding:10px 14px}
.m.adj b{display:block;font-weight:650}.m.adj small{display:block;color:var(--tx2);font-size:12px}
.m code{font:13px var(--mono);background:#2a2a30;border-radius:5px;padding:1px 5px}
.estado{align-self:flex-start;display:flex;align-items:center;gap:9px;color:var(--tx2);font-size:13.5px}
.estado span{background:linear-gradient(90deg,var(--tx2) 0%,#fff 50%,var(--tx2) 100%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brillo 1.6s linear infinite}
.aviso{align-self:center;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx3)}
.aviso b{color:var(--tx2);font-weight:600}
.vacio{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--tx3);text-align:center;padding:60px 20px}
.vacio b{color:var(--tx);font-size:18px}
.m pre{margin:6px 0;padding:10px 12px;border-radius:10px;background:#16161a;font:12.5px/1.5 var(--mono);white-space:pre-wrap;overflow-x:auto}
.m.pend{opacity:.6}
.m.preg{border:1.5px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.m.preg small{display:block;color:var(--warn);font-size:11.5px;font-weight:650;margin-bottom:3px}
.m.preg .det{color:var(--tx2);font-size:12.5px;margin-top:4px}
.grupo{align-self:flex-start;display:flex;flex-direction:column;gap:6px;max-width:78%}
.grupo .m{max-width:100%}
.grupo.yo{align-self:flex-end;align-items:flex-end}
.herr{font-size:12px;color:var(--tx3);padding:0 4px}
.estado .parar{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--tx3);background:#232328;margin-left:4px}
.estado .parar:hover{color:var(--tx);background:#2c2c33}
.pidebox{margin:0 12px 10px;padding:9px 12px;border-radius:12px;background:#2a2418;color:#f1d9a8;font-size:13px;white-space:pre-wrap}
.sk .res .rt{flex:1;min-width:0;font-size:13px;color:var(--tx2);white-space:pre-wrap}
.hoja .meta{color:var(--tx3);font-size:12px;margin-top:6px}
/* render incremental: solo lo que aparece por primera vez entra con animación (lo demás no se vuelve a animar) */
.nuevo{animation:entra .32s var(--ease) both}
.cola,.pz{display:flex;flex-direction:column;gap:14px}
.cola:empty{display:none}
/* piezas del navegador: lo que en la terminal es texto (🧠, menú de archivo) aquí es una tarjeta */
.logro{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:16px;background:#1d1d21;border:1px solid #2c2c33;max-width:440px}
.logro .li{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--ac) 18%,#26262b);color:color-mix(in srgb,var(--ac) 80%,#fff)}
.logro .tx{flex:1;min-width:0}.logro b{display:block;font-size:13.5px}.logro small{display:block;color:var(--tx3);font-size:12px}
.logro .chip,.arch-c .chip{padding:5px 12px;font-size:12.5px}
.arch-c{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border-radius:16px;background:#1d1d21;border:1px solid #2c2c33;max-width:480px}
.arch-c .di{width:26px;height:30px;border-radius:5px;background:#2a2a30;flex:none;position:relative}
.arch-c .di::after{content:"";position:absolute;left:6px;right:6px;top:8px;height:13px;background:repeating-linear-gradient(#4f4f58 0 2px,transparent 2px 5px)}
.arch-c .tx{flex:1;min-width:0}.arch-c b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arch-c small{display:block;color:var(--tx3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.error-c{align-self:flex-start;display:flex;gap:11px;padding:12px 14px;border-radius:16px;background:#221a1a;border:1.5px solid color-mix(in srgb,var(--bad) 40%,transparent);max-width:520px}
.error-c .ei{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bad);color:#fff;font-weight:800;font-size:14px}
.error-c b{display:block;font-size:14px}.error-c small{display:block;color:var(--tx2);font-size:12.5px;margin-top:2px}
.error-c .det{margin-top:6px;font:11.5px/1.4 var(--mono);color:#b9a3a0;white-space:pre-wrap;word-break:break-word}
/* respuestas rápidas */
.chips{align-self:flex-start;display:flex;flex-wrap:wrap;gap:8px;margin-top:-4px}
.herr .quitar{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
/* en cola por su caja: lo que hay en ella (o al pie de su pantalla) y su salida */
.cajatiene{max-width:100%;padding:8px 12px;border-radius:12px;border:1px dashed #3a3a42;color:var(--tx2);font-size:12.5px}
.cajatiene small{display:block;color:var(--tx3);font-size:12px;margin-bottom:3px}
.cajatiene div{font:12px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word}
.grupo.yo .chips{align-self:flex-end;margin-top:0}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;border:1.5px solid #36363e;font-weight:650;font-size:13.5px;color:var(--tx);transition:background-color .15s,transform .2s var(--ease),filter .15s}
.chip:hover{background:#26262c;transform:translateY(-1px)}
.chip.p{background:var(--ac);color:var(--acx);border-color:transparent}
.chip.p:hover{background:var(--ac);filter:brightness(1.08)}
.chip:disabled{opacity:.4;cursor:not-allowed;transform:none}
/* la tarjeta de la skill, dentro del chat: color y monito del agente */
.sk{align-self:flex-start;width:min(520px,100%);border-radius:20px;background:var(--card);overflow:hidden;border:1.5px solid color-mix(in srgb,var(--ac) 26%,#2c2c33)}
.sk .hd{display:flex;align-items:center;gap:9px;padding:12px 14px 8px}
.sk .hd b{font-size:14.5px;font-weight:700}
.sk .hd small{margin-left:auto;font-size:12px;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--ac) 16%,transparent);color:color-mix(in srgb,var(--ac) 75%,#fff);font-weight:650;white-space:nowrap}
.sk.fin .hd small{background:color-mix(in srgb,var(--ok) 18%,transparent);color:#8fe0b5}
.sk.mal .hd small{background:color-mix(in srgb,var(--bad) 18%,transparent);color:#f2a39a}
.sk .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#2a2a31}
.sk .barra{height:7px;margin:2px 14px 4px;border-radius:999px;background:#2c2c33;overflow:hidden}
.sk .barra b{display:block;height:100%;background:var(--ac);border-radius:999px;transition:width .6s var(--ease)}
.sk ol{list-style:none;padding:8px 6px 10px}
.sk.franja{width:min(760px,100% - 40px);margin:0 auto 6px;align-self:auto}.sk.franja .hd{padding:10px 14px 0}
.mos .sk.franja{grid-column:1/-1;width:100%;margin:0}
.herr.abre{cursor:pointer}.herr-lista{font-size:12px;color:var(--tx3);padding:2px 4px 0 14px;white-space:pre-wrap}
.sk li{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:12px;font-size:13.5px;color:var(--tx3);transition:color .3s}
.sk li i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:#2a2a30;color:var(--tx3);transition:background-color .3s}
.sk li.hecho{color:var(--tx2)}.sk li.hecho i{background:color-mix(in srgb,var(--ac) 32%,#2a2a30);color:var(--tx);animation:pop .35s var(--ease)}
.sk li.ahora{color:var(--tx);background:color-mix(in srgb,var(--ac) 9%,#222227)}.sk li.ahora i{background:var(--ac);color:var(--acx)}
.sk li.ahora span{background-image:linear-gradient(90deg,var(--tx) 0%,color-mix(in srgb,var(--ac) 70%,#fff) 50%,var(--tx) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brillo 1.6s linear infinite}
.sk li.pide{color:var(--warn);background:#2a2418}.sk li.pide i{background:var(--warn);color:#2a1b00;animation:lat 1.2s steps(2) infinite}
.sk li.mal{color:#f2a39a}.sk li.mal i{background:var(--bad);color:#fff}
.sk .res{display:flex;align-items:center;gap:10px;margin:0 12px 12px;padding:8px 8px 8px 12px;border-radius:14px;background:#1a1a1e;font-size:13.5px}
.sk .res b{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk .res .chip{padding:6px 14px;font-size:12.5px}
/* la tira de la skill junto a la caja */
.activa{width:min(760px,100% - 40px);margin:0 auto 6px;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:18px;font-size:13px;background:color-mix(in srgb,var(--ac) 9%,#1b1b1f);border:1.5px solid color-mix(in srgb,var(--ac) 30%,#2c2c33)}
.activa b{font-weight:650}.activa small{color:var(--tx2)}
.activa .pt{width:8px;height:8px;border-radius:50%;background:var(--ac);animation:lat 1s steps(2) infinite;flex:none}
.activa .acts{margin-left:auto;display:flex;gap:6px}
.activa .chip{padding:6px 14px;font-size:12.5px}
/* la caja */
.box{width:min(760px,100% - 40px);margin:0 auto 18px;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 10px;border-radius:26px;background:#1e1e22;border:1px solid #2c2c32;transition:border-color .2s;flex:none}
.box:focus-within{border-color:#3d3d45}
.box textarea{flex:1;resize:none;max-height:180px;min-height:24px;padding:7px 4px;line-height:1.45}
.box textarea::placeholder{color:var(--tx3)}
.adjw{width:min(760px,100% - 40px);margin:0 auto 6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.adjc{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;border-radius:999px;background:#202024;border:1px solid #2c2c33;font-size:12.5px;color:var(--tx2);max-width:260px}
.adjc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adjc.sub{opacity:.6}.adjc.mal{border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:#f2a39a}
.adjx{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--tx3);flex:none}.adjx:hover{background:#2c2c33;color:var(--tx)}
.adjx svg{width:11px;height:11px}
.cb.voz{position:relative}
.cb.voz .ondas{display:none;position:absolute;inset:0;align-items:center;justify-content:center;gap:2px}
.cb.voz.on{background:color-mix(in srgb,var(--bad) 22%,#202024);color:#f2a39a}
.cb.voz.on svg{opacity:0}.cb.voz.on .ondas{display:flex}
.cb.voz .ondas i{width:3px;height:10px;border-radius:2px;background:#f2a39a;animation:onda .9s ease-in-out infinite}
.cb.voz .ondas i:nth-child(2){animation-delay:.15s}.cb.voz .ondas i:nth-child(3){animation-delay:.3s}
@keyframes onda{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1.2)}}
.mid.soltar::after{content:"Suéltalo para adjuntarlo";position:absolute;inset:10px;border:2px dashed #4a4a52;border-radius:18px;display:grid;place-items:center;color:var(--tx2);font-weight:650;background:rgba(20,20,22,.7);pointer-events:none;z-index:20}
.uso{flex:none;font-size:11.5px;color:var(--tx3);padding:3px 14px;overflow-wrap:anywhere}
.uso:empty{display:none}

/* ---------- panel derecho ---------- */
.side{position:relative;width:0;overflow:hidden;background:var(--panel);border-left:1px solid #222227;transition:width .3s var(--ease)}
.side.on{width:340px}.side.ancho{width:620px}
.side .in{width:340px;height:100%;overflow:auto;padding:18px 18px 40px;position:relative}
.side.ancho .in{width:620px}
.side .x{position:absolute;right:12px;top:12px;z-index:2}
.h2{font-size:18px;font-weight:700}.sub{color:var(--tx3);font-size:12.5px;margin-bottom:14px}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 4px}
.nombre{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700}
.nombre input{width:200px;text-align:center;padding:3px 8px;border-radius:8px;border:1px solid #3a3a42;font-size:17px;font-weight:700}
.lapiz{color:var(--tx3);display:grid;place-items:center;width:26px;height:26px;border-radius:7px}.lapiz:hover{background:#26262b;color:var(--tx)}
.lbl7{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);margin:16px 2px 8px}

.ins{margin-top:6px;padding:8px 10px;border-radius:9px;background:#161619;font:11.5px/1.5 var(--mono);color:#c9c9d0}

.badge{display:inline-block;margin-left:8px;vertical-align:1px;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--tx2);background:#2e2e35;border-radius:999px;padding:2px 9px}
.btc{height:38px;padding:0 17px;border-radius:999px;background:var(--ac);color:var(--acx);font-weight:650;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}

/* crear agente: el monito grande en vivo */

.ca .prev{height:140px;display:grid;place-items:end center;margin-bottom:18px}
.ca .formar{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
.ca .nom{width:100%;height:50px;font-size:15.5px;background:#202024;border:1px solid #34343b;border-radius:14px;text-align:center;color:var(--tx)}
.ca .nom:focus{border-color:#5a5a64;outline:none}
.ca .ayu{width:100%;height:44px;padding:0 14px;font-size:14px;background:#202024;border:1px solid #34343b;border-radius:14px;color:var(--tx)}
.ca .ayu::placeholder{color:var(--tx3)}
.ca .ayu:focus{border-color:#5a5a64;outline:none}
.ca .fms{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%}

.ca .fms button:hover{background:#25252b;transform:translateY(-2px)}
.ca .fms button.on{background:#28282e;box-shadow:inset 0 0 0 2px #5a5a64}

.ca .cls button.on{box-shadow:0 0 0 3px #1c1c20,0 0 0 5.5px #8a8a94}
/* AG8-b: su comando, el motor (se elige solo, se puede cambiar) y «Ya tengo un agente» */
.ca .cmd{margin-top:-12px;min-height:16px;color:var(--tx3);font-size:12.5px}
.ca .mots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.ca .mots .mot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 12px;border-radius:12px;background:#202024;border:1px solid #34343b;min-width:120px;text-align:left}
.ca .mots .mot:hover{background:#25252b}
.ca .mots .mot.on{border-color:#8a8a94;background:#28282e}
.ca .mots .mot b{font-size:13.5px;font-weight:600}
.ca .mots .mot small{font-size:12px;color:var(--tx3)}
.ca .mots .mot small.ok{color:var(--ok)}
.ca .mots .mot small.mal{color:#e7a43a}
.ca .pvacio{text-align:center;max-width:100%}
.ca .encs{display:flex;flex-direction:column;gap:6px;width:100%;margin-bottom:12px}
.ca .encs .sub{margin-bottom:4px}
.ca .enc{display:grid;grid-template-columns:36px 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:#202024;border:1px solid #34343b;text-align:left;width:100%}
.ca .enc .ico{grid-row:1 / span 2;display:grid;place-items:center}
.ca .enc b{font-size:14px}
.ca .enc small{grid-column:2;color:var(--tx3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ca .enc em{grid-column:3;grid-row:1 / span 2;font-style:normal;font-size:12px;color:var(--tx3)}
.ca .enc em.nuevo{color:var(--ok)}
.ca .enc em.otro,.ca .enc em.incompleto{color:#e7a43a}
.ca .enc.on{border-color:#8a8a94;background:#28282e}
.ca .enc:hover:not(:disabled){background:#25252b}
.ca .enc:disabled{opacity:.6;cursor:default}
.ca .lnk{background:none;border:0;color:var(--tx2);text-decoration:underline;font-size:13px;margin:0 0 10px;cursor:pointer}
.vacio .bt{margin-top:12px}
/* B22 (cacería 19-nov): en el celular (hasta 640 px) la página se puede usar. Antes, a 390 px el riel (84), el
   panel lateral (340) y el chat no cabían: el chat quedaba en 0 con el panel abierto y su ✕ fuera de la pantalla, el
   motor de arriba se salía y la caja de escribir medía 20-97 px. Ahora el riel se angosta, la barra de arriba
   encoge el nombre y deja a la vista el motor, lo que escribes va en su renglón a todo lo ancho (los botones,
   debajo) y el panel va ENCIMA del chat, a todo lo ancho, con su ✕ a la vista */
@media (max-width:640px){
  .app{grid-template-columns:60px minmax(0,1fr) 0}
  .rail{padding:10px 0}
  .av7{width:52px}
  .top{display:flex;justify-content:space-between;gap:6px;padding:10px 8px;height:56px}
  .top #pill{min-width:0;flex:0 1 auto;max-width:none}
  .top .der{flex:none;gap:4px}
  .top .ghost{padding:6px 9px}
  .col,.box{width:calc(100% - 16px)}
  .box{flex-wrap:wrap;margin-bottom:10px;gap:4px;padding:6px 6px 6px 8px;border-radius:20px}
  .box textarea{order:-1;flex:1 1 100%}
  .box .voz{margin-left:auto}
  .uso{display:none}
  .ajb{padding:0 8px}
  .ajb span{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side{position:fixed;top:0;right:0;bottom:0;z-index:30;border-left:0}
  .side.on,.side.ancho,.side.on .in,.side.ancho .in{width:100vw}
}
/* en el celular la ventana cabe a lo ancho y se recorre por dentro (antes medía 468 px fijos) */
@media (max-width:640px){
  .modal.ca{width:calc(100vw - 16px);max-height:calc(100vh - 16px);display:flex;flex-direction:column}
  .ca .mb{overflow:auto;padding:14px 14px 18px}
  .ca .fms{gap:4px}
  .ca .cls{gap:10px}
  .ca .mots .mot{min-width:0;flex:1 1 40%}
}

/* ===== la página para gente que no sabe de terminal: la tarjeta de un motor con problemas (52_amigable.js) ===== */
.ami{align-self:stretch;display:flex;gap:14px;padding:16px 18px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);animation:entra .35s var(--ease)}
.ami.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.ami .mono{flex:none;width:52px;height:52px;display:grid;place-items:center}
.ami .tx{flex:1;min-width:0}
.ami b.t{display:block;font-size:16px;font-weight:700;color:var(--tx);line-height:1.3}
.ami p{margin:5px 0 0;color:var(--tx2);font-size:13.5px;line-height:1.5}
.ami p.ojo{color:var(--warn)}
.ami .hace{display:flex;align-items:center;gap:9px;margin-top:12px;color:var(--tx);font-size:13.5px}
.ami .hace i{width:14px;height:14px;flex:none;border-radius:50%;border:2px solid var(--line);border-top-color:var(--tx);animation:ami-gira .9s linear infinite}
@keyframes ami-gira{to{transform:rotate(360deg)}}
.ami ol.guia{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px}
.ami ol.guia li{display:flex;align-items:center;gap:12px;font-size:13.5px;line-height:1.45;color:var(--tx)}
.ami ol.guia .n{width:24px;height:24px;flex:none;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:12.5px;color:var(--tx)}
.ami ol.guia .dib{flex:none}
.ami .grande{margin-top:16px;padding:12px 24px;font:700 15px var(--sans);border-radius:14px;background:var(--ac);color:var(--acx);border:0;cursor:pointer;transition:transform .15s var(--ease),filter .15s}
.ami .grande:hover{filter:brightness(1.08);transform:translateY(-1px)}

.ami .botones{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.ami .botones .grande{margin-top:0}
.ami kbd{font:600 12.5px var(--mono);background:var(--card2);padding:2px 8px;border-radius:7px;border:1px solid var(--line);color:var(--tx)}
.ami .cmd{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ami .cmd code{font:12px var(--mono);background:var(--card2);padding:7px 10px;border-radius:8px;color:var(--tx);word-break:break-all}
.ami details.vd,.perm details.vd{margin-top:14px;color:var(--tx3);font-size:12px}
.perm details.vd{margin-top:8px}
.ami details.vd summary,.perm details.vd summary{cursor:pointer;width:max-content}
.ami details.vd pre,.perm details.vd pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font:11.5px/1.45 var(--mono);color:var(--tx3)}
.aviso.ami-av{flex-wrap:wrap;justify-content:center;text-align:center}

/* ===== skills v11 · el proceso de una skill (P-1, 60_skills.js · construirProceso), la barra sobre la caja, las marcas del
   chat y la pregunta por la caja de escribir (Q-2, 55_caja.js). Medido en Prototipo_Skills_v11.html ===== */
.bt5{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;border:1px solid #33333a;font-size:12.5px;font-weight:600;color:var(--tx2);white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s,transform .12s ease-out}
.bt5:hover{color:var(--tx);border-color:#45454d;background:#232328}
.bt5.ac{border-color:transparent;background:#2c2c33;color:var(--tx)}
.bt5.ac:hover{background:#36363e}
.bt5:active{transform:scale(.95)}
/* ---------- el proceso: una tarjeta tranquila; arriba camina el monito ---------- */
.pr3{padding:46px 16px 16px}
.p1v{display:flex;flex-direction:column;min-height:100%}
.hero3{position:relative;border-radius:14px;padding:13px 14px 12px 16px;background:#1d1d21;border:1px solid var(--borde)}
.h5{display:flex;align-items:center;gap:8px}
.h5 .emb7{margin-right:2px}
.nm5{flex:1;min-width:0;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic5{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--tx3);margin:-4px -6px -4px 0;flex:none;transition:color .15s,background-color .15s,transform .12s ease-out}
.ic5:hover{color:var(--tx);background:#26262c}
.ic5:active{transform:scale(.92)}
.pista3{height:3px;border-radius:2px;background:#2a2a30;margin:11px 0 12px;overflow:hidden}
.pista3 i{display:block;height:100%;border-radius:2px;background:var(--ac);transition:width .8s var(--ease),background-color .4s}
.hero3.fin .pista3 i{background:var(--ok)}
.pasos3{list-style:none;display:flex;flex-direction:column;gap:1px;margin:0;padding:0}
.pasos3 li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;margin:0;background:none;border-radius:0;font-size:13.5px;color:var(--tx3);transition:color .35s}
.pasos3 .mk{flex:none;width:14px;height:20px;display:grid;place-items:center;color:var(--tx3);font-style:normal}
.pasos3 li.luego .mk::after{content:"";width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #4a4a52}
.pasos3 li.ahora .mk::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac);animation:pulso3 1.6s ease-in-out infinite}
.pasos3 li.hecho{color:var(--tx2)}
.pasos3 li.ahora{color:var(--tx)}
.pasos3 .tx{flex:1;min-width:0;line-height:20px}
.pasos3 .vv{font-size:12.5px;line-height:18px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pasos3 .vv:empty{display:none}
@keyframes pulso3{0%,100%{opacity:1}50%{opacity:.35}}
/* el paso en pausa: un aro que late y «Necesita tu respuesta»; el reloj se detiene */
.pasos3 li.pide{color:var(--tx)}
.pasos3 li.pide .mk::after{content:"";width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ac);animation:pausa10 2.2s ease-in-out infinite}
.pasos3 li.pide .vv{color:color-mix(in srgb,var(--ac) 62%,#ededf0);font-weight:600}
/* skills-cierre: el paso donde se detuvo (sin «fin»): quieto, sin latido */
.pasos3 li.pausa{color:var(--tx)}
.pasos3 li.pausa .mk::after{content:"";width:8px;height:8px;border-radius:2px;background:#6a6a73}
.pasos3 li.pausa .vv{color:var(--tx2);font-weight:600}
.pie5 .pausa6{flex:1;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--tx2);min-width:0}
.pie5 .pausa6 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pausa10{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
/* el aviso bajo la tarjeta: «Esperando tu respuesta abajo ↓» */
.pq10{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease),margin-top .45s var(--ease),opacity .3s;margin-top:0;opacity:0}

.lb6{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 8px;font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}

.feed6{display:flex;flex-direction:column;gap:1px}

/* el resultado: una página chiquita que se arma (esqueleto con brillo suave) y al final toma color */
.res8{padding:10px;border-radius:14px;background:#1d1d21;border:1px solid var(--borde)}
.mini8{position:relative;height:96px;border-radius:9px;background:#232328;overflow:hidden;display:flex;flex-direction:column}

.mini8 .pg8 i{display:block}
.mini8 .pg8 .tl{grid-column:1/-1;height:7px;width:62%;border-radius:3px;background:#3a3a42;transition:background-color .6s}
.mini8 .pg8 .st{grid-column:1/-1;height:4px;width:40%;border-radius:2px;background:#33333a}

.mini8::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.055) 50%,transparent 65%);transform:translateX(-100%);animation:barre8 1.9s ease-in-out infinite}

/* Configuración → Conexiones (77_conexiones.js). Conexiones en verde: tres estados, una pestaña por motor y una acción por

.cxv-chips{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 4px}

.top .tabs{grid-column:1;grid-row:1;justify-self:stretch;min-width:0;display:flex;align-items:center;gap:3px;overflow:hidden;white-space:nowrap}

   Lo que un motor no usa o no se puede revisar no aparece. La matriz de la prueba a fondo (vxLab, más abajo) queda solo

var CX = { d: null, t: 0, cargando: false, motor: '', lab: false, reloj: null };

  var d = CX.d;

/* ================= arranque ================= */
/* el panel NO se repinta en cada pintar(): cambiaría bajo tus dedos (y parpadeaba); solo cuando hace falta */
function pintar(conPanel) { pintarRiel(); pintarTop(); if (typeof pintarTabs === 'function') pintarTabs(); pintarHilo(); pintarActiva(); pintarSend(); if (conPanel) pintarPanel(); }
(function () {
  var ta = $('#ta');

    if (e.key === 'Escape' && SLASH) { SLASH = null; cerrarCapas(); return; }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && (!CFG_LOCAL.get('cmdEnter') || e.metaKey || e.ctrlKey)) {
      e.preventDefault(); var v = ta.value;
      /* §6: modelo y esfuerzo son botones; su selector ya no sale en el chat. «/model» y «/effort» abren la pastilla */

      SLASH = null; cerrarCapas();
      enviarCaja();

  });

  $('#fileIn').onchange = function () { adjuntar(this.files); this.value = ''; };
  prepararVoz(); prepararSoltar();
  document.addEventListener('keydown', teclasTabs);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || SLASH || document.querySelector('.pop')) return;
    if (document.querySelector('.velo7')) return cerrarHoja();
    if (document.querySelector('.velo')) return document.querySelector('.velo').remove();
    var ae = document.activeElement; if (ae && /INPUT|TEXTAREA/.test(ae.tagName) && ae.value) return;
    if (S.EDIT) { if (S.EDIT.sucio) return nota('Guarda o descarta lo que editas primero', true); S.EDIT = null; return pintarPanel(); }
    if (S.PANEL) { S.PANEL = ''; pintarPanel(); pintarTop(); }

      .then(function () {
        var a = activo(); if (a) cargarUsoSnap(a);
        Object.keys(S.vivo).forEach(function (id) { var f = S.vivo[id], x = ag(id); if (x) ponerEjecuciones(x, f.ejecuciones || []); });
        return a ? cargarConversacion(a) : null;
      })
      .then(function () { $('#col').textContent = ''; pintar(true); escuchar(); sondeoChat(); avisoApartadoPendiente(); setTimeout(guiaPrimeraVez, 700); setInterval(cargarSkills, 60000); setInterval(cargarMotores, 60000); setInterval(cargarInicio, 30000); setInterval(function () { var a = activo(); if (a) cargarUsoSnap(a); }, 30000); },
        function (e) {
          intento++;
          var C = $('#col'); C.textContent = ''; C.appendChild(el('div', 'vacio', 'No pude hablar con Workspace (' + e.message + '). Reintento en ' + Math.min(30, 2 * intento) + ' s…'));

          setTimeout(arrancar, Math.min(30, 2 * intento) * 1000);
        });
  }
  arrancar();
})();
