.lc-n{flex:1;min-width:0;font-size:var(--f3);color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-t.on .lc-n{color:var(--tx);font-weight:600}.lc-t.viva .lc-n{color:var(--tx)}
.lc-vacio{padding:12px 10px;font-size:var(--f2);color:var(--tx3)}
.chm .th{padding:0 18px}
.cvx-fuente{display:flex;align-items:center;justify-content:center;gap:6px;max-width:760px;margin:0 auto 14px;padding:0 24px;font-size:var(--f1);color:var(--tx3)}
.cvx-res{max-width:760px;margin:0 auto 12px;padding:0 24px}
/* ================= colapsar: más espacio cuando lo pides ================= */
body{--nav-w:220px;--rail-w:300px;--lista-w:248px}
body.nav-min{--nav-w:62px}
body.rail-off{--rail-w:0px}
body.lista-off{--lista-w:0px}
body[data-den] .app{grid-template-columns:var(--nav-w) minmax(0,1fr) var(--rail-w) 0!important;transition:grid-template-columns .32s cubic-bezier(.22,1,.36,1)}
body.rail-off .rail{display:none!important}
.scr.chat2.on{grid-template-columns:var(--lista-w) minmax(0,1fr)!important;transition:grid-template-columns .32s cubic-bezier(.22,1,.36,1)}
body.lista-off .chl{visibility:hidden;padding:0!important;border:0!important;overflow:hidden}
.ui-b{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:9px;color:var(--tx3);transition:background-color .15s,color .15s}
.ui-b:hover{background:color-mix(in srgb,var(--tx) 6%,transparent);color:var(--tx)}
.ui-b.on{color:var(--tx)}
.chm .th{gap:10px}
.ch-tt{display:flex;flex-direction:column;min-width:0;flex:1}
.ch-tit{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:2px 6px;margin:0 -6px;border-radius:8px;text-align:left;transition:background-color .15s}
.ch-tit:hover{background:color-mix(in srgb,var(--tx) 5%,transparent)}
.ch-tit h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-tit .ic{color:var(--tx3);flex:none}
.chm .th .meta{margin-left:0}
/* menú principal en íconos */
body.nav-min .side .navs{padding:4px 8px}
body.nav-min .nv{justify-content:center;font-size:0!important;padding:9px 0!important;gap:0}
body.nav-min .nv .ic{width:18px;height:18px}
body.nav-min .nv .c.hot{position:absolute;top:3px;right:6px;min-width:15px!important;height:15px!important;font-size:9px!important;padding:0 3px!important}
body.nav-min .nv.on:after,body.nav-min .nv:before{display:none!important}
body.nav-min .gl{font-size:0!important;margin:10px 6px 6px!important;height:1px;background:color-mix(in srgb,var(--tx) 10%,transparent)}
body.nav-min .kbar{justify-content:center;font-size:0;padding:8px 0}.body.nav-min .kbar kbd{display:none}
body.nav-min .kbar kbd{display:none}
body.nav-min .user{flex-direction:column;padding:10px 6px}
body.nav-min .user>div{display:none}
body.nav-min .nav-b .ic{transform:scaleX(-1)}
.user{gap:8px}.nav-b{margin-left:auto}
/* ================= marca del agente: un cuadrito pixel de su color ================= */
.mca{display:inline-block;flex:none;width:9px;height:9px;border-radius:2px;background:var(--c);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 60%,#000);image-rendering:pixelated;position:relative}
.mca:after{content:"";position:absolute;left:2px;top:2px;width:2px;height:2px;background:#ffffffa0}
.ch-ag .mca{margin-right:2px}
/* ================= lista de conversaciones ================= */
.chl{padding:12px 8px 10px!important}
.lc-top{padding:0 2px 6px}
.lc-qw{display:flex!important;align-items:center;gap:8px;margin:0!important;padding:7px 10px!important;border-radius:9px;background:var(--card);border:1px solid color-mix(in srgb,var(--tx) 10%,transparent)}
.lc-qw kbd{font-family:var(--sans);font-size:10px;color:var(--tx3);border:1px solid color-mix(in srgb,var(--tx) 14%,transparent);border-radius:5px;padding:0 4px}
.lc-sec{margin:6px 0 2px}
.lc-sh{position:relative;display:flex;align-items:center}
.lc-shb{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:6px 8px;border-radius:8px;text-align:left;transition:background-color .15s}
.lc-shb:hover{background:color-mix(in srgb,var(--card) 80%,transparent)}
.lc-shb .ic{color:var(--tx3);transform:rotate(-90deg);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.lc-sec.on .lc-shb .ic{transform:none}
.lc-shb b{font-size:var(--f3);font-weight:700;color:var(--tx)}
.lc-shb em{margin-left:auto;font-style:normal;font-size:var(--f1);color:var(--tx3)}
.lc-sv{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:var(--f1);font-weight:700;color:var(--ok2)}
.lc-mas{width:24px;height:24px;margin-left:2px;border-radius:7px;font-size:16px;line-height:1;color:var(--tx3);opacity:0;transition:opacity .15s,background-color .15s}
.lc-sh:hover .lc-mas{opacity:1}.lc-mas:hover{background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc)}
.lc-sb{padding:0 0 4px 14px;margin-left:12px;border-left:1px dashed color-mix(in srgb,var(--c) 45%,transparent)}
.lc-t{padding:6px 9px!important;border-radius:7px!important}
.lc-n{font-size:var(--f3)!important}
.lc-viva{flex:none;width:7px;height:7px;border-radius:50%;background:var(--ok2);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok2) 16%,transparent)}
.lc-w{flex:none;font-size:var(--f1);color:var(--tx3);opacity:0;transition:opacity .15s}
.lc-t:hover .lc-w{opacity:1}
.lc-vm{display:block;margin:2px 0 4px 9px;font-size:var(--f2);font-weight:600;color:var(--acc)}
.lc-new{display:flex;align-items:center;gap:7px;margin:4px 0;padding:5px 9px;border-radius:8px;background:var(--card);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);color:var(--acc)}
.lc-ni{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:var(--f3);color:var(--tx);outline:0}
.ss-pop{width:420px;padding:6px}
.ss-qw{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid color-mix(in srgb,var(--tx) 8%,transparent);margin-bottom:4px;color:var(--tx3)}
.ss-q{flex:1;border:0;background:transparent;font:inherit;font-size:var(--f4);color:var(--tx);outline:0}
.ss-l{max-height:360px;overflow:auto}
.ss-i{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.ss-i.on{background:color-mix(in srgb,var(--acc) 9%,var(--card))}
.ss-n{flex:1;min-width:0;font-size:var(--f3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-i small{font-size:var(--f1);color:var(--tx3);white-space:nowrap}
/* ================= la conversación con el estilo de la casa ================= */
.vent{display:inline-block;flex:none;width:22px;height:6px;background:linear-gradient(90deg,var(--acc) 0 6px,transparent 6px 8px,var(--yel) 8px 14px,transparent 14px 16px,color-mix(in srgb,var(--tx) 30%,transparent) 16px 22px)}
body.fx-e .vent{animation:leds 1.5s steps(1) infinite}
.cvx{gap:22px!important}
.cvx-m.cvx-agt .cvx-c{max-width:720px}
.cvx-n{display:flex!important;align-items:center;gap:7px;margin-bottom:6px!important}
.cvx-n b{font-size:var(--f2);font-weight:700;color:color-mix(in srgb,var(--c, var(--tx)) 0%,var(--tx))}
.cvx-m.yo .cvx-b{background:var(--card)!important;border:1px solid color-mix(in srgb,var(--tx) 12%,transparent)!important;border-radius:14px 14px 4px 14px!important;box-shadow:inset 0 1px 0 #ffffff80,0 1px 2px rgba(0,0,0,.05),3px 3px 0 color-mix(in srgb,var(--acc) 22%,transparent)}
.cvx-h{border:1px solid color-mix(in srgb,var(--tx) 10%,transparent);background:var(--card)!important;border-radius:10px!important}
.cvx-h summary{gap:9px!important}
.cvx-h[open] summary{border-bottom:1px dashed color-mix(in srgb,var(--tx) 10%,transparent)}
.cvx-cod{margin:10px 0;border-radius:10px;overflow:hidden;background:var(--code,#0f1a1e);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cvx-cb{display:flex;align-items:center;gap:9px;padding:7px 12px;background:color-mix(in srgb,#000 25%,var(--code,#0f1a1e));color:#cfd8d6;font:600 10.5px/1 var(--mono);letter-spacing:.04em;text-transform:lowercase}
.cvx-cod .cv-code{margin:0;border-radius:0}
.cvx-box{position:relative}
.cvx-trama{display:block;height:6px;margin:0 6px 8px;opacity:.35;background:linear-gradient(90deg,var(--K) 50%,transparent 50%) 0 0/4px 2px repeat-x,linear-gradient(90deg,transparent 50%,var(--K) 50%) 0 2px/4px 2px repeat-x,linear-gradient(90deg,var(--K) 25%,transparent 25%) 0 4px/8px 2px repeat-x;animation:trama 2.4s steps(4) infinite}
.cvx-box .inbox{border-radius:14px!important;box-shadow:inset 0 1px 0 #ffffff80,0 2px 10px rgba(0,0,0,.06)!important}
.cvx-b2{border:1px solid color-mix(in srgb,var(--ok2) 25%,transparent)}
/* ================= sala, con el mismo lenguaje ================= */
.sl-h{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid color-mix(in srgb,var(--tx) 10%,transparent);margin-bottom:12px}
.sl-ht{display:flex;align-items:center;gap:9px}.sl-ht b{font-size:var(--f4)}
.sl-p{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.sl-pi{display:inline-flex;align-items:center;gap:6px;font-size:var(--f2);color:var(--tx2)}
.sl-f{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 360px);overflow:auto;padding:2px 2px 6px}
.sl-m{padding-left:12px;border-left:2px solid color-mix(in srgb,var(--tx) 10%,transparent)}
.sl-m.yo{border-left-color:color-mix(in srgb,var(--acc) 55%,transparent)}
.sl-m.pide{border-left-color:var(--wait);background:color-mix(in srgb,var(--wait) 8%,transparent);border-radius:0 8px 8px 0;padding:6px 8px 6px 12px}
.sl-q{display:flex;align-items:center;gap:7px}
.sl-q b{font-size:var(--f2);font-weight:700}.sl-q em{font-style:normal;font-size:var(--f1);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9a6a0c}
.sl-q small{margin-left:auto;font-size:var(--f1);color:var(--tx3)}
.sl-m p{margin:3px 0 0;font-size:var(--f3);line-height:1.5;color:var(--tx)}
.sl-acts{display:flex;align-items:center;gap:10px;margin-top:12px}.sl-acts small{font-size:var(--f2);color:var(--tx3)}

/* encabezado del chat: el título siempre se lee; los botones se encogen a ícono si falta ancho */
.chm{container:chm/inline-size}
.chm .th .ch-tt{flex:1 1 auto;min-width:130px}
.chm .th .acts{flex:none;flex-wrap:nowrap}
@container chm (max-width:880px){.chm .th .acts .lb,.chm .th .acts .sk-chip .ic:last-child{display:none}.chm .th .acts .ib.sm{padding-inline:9px}}
@container chm (max-width:700px){.chm .th .mm-cv{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cx-tg .cx-o{padding-inline:9px}}
/* herramientas: marca quieta y neutra (rojo/verde se reservan para estado) */
.cvx-h .vent{width:14px;height:6px;animation:none!important;background:linear-gradient(90deg,color-mix(in srgb,var(--tx) 38%,transparent) 0 4px,transparent 4px 5px,color-mix(in srgb,var(--tx) 24%,transparent) 5px 9px,transparent 9px 10px,color-mix(in srgb,var(--tx) 14%,transparent) 10px 14px)}
.cvx-h[open] .vent{background:linear-gradient(90deg,var(--acc) 0 4px,transparent 4px 5px,color-mix(in srgb,var(--acc) 60%,transparent) 5px 9px,transparent 9px 10px,color-mix(in srgb,var(--acc) 30%,transparent) 10px 14px)}
/* foquitos de ventana sobre fondo claro: los apagados se ven (el blanco translúcido solo sirve en oscuro) */
@keyframes leds2{0%{background:linear-gradient(90deg,var(--acc) 0 6px,transparent 6px 8px,color-mix(in srgb,var(--tx) 18%,transparent) 8px 14px,transparent 14px 16px,color-mix(in srgb,var(--tx) 18%,transparent) 16px 22px)}
 33%{background:linear-gradient(90deg,color-mix(in srgb,var(--tx) 18%,transparent) 0 6px,transparent 6px 8px,var(--yel) 8px 14px,transparent 14px 16px,color-mix(in srgb,var(--tx) 18%,transparent) 16px 22px)}
 66%{background:linear-gradient(90deg,color-mix(in srgb,var(--tx) 18%,transparent) 0 6px,transparent 6px 8px,color-mix(in srgb,var(--tx) 18%,transparent) 8px 14px,transparent 14px 16px,#3fae7a 16px 22px)}}
body.fx-e .vent{animation-name:leds2}
body.fx-e .cvx-cb .vent{animation-name:leds}

.sl-f{-webkit-mask-image:linear-gradient(transparent 0,#000 26px);mask-image:linear-gradient(transparent 0,#000 26px);padding-top:14px}

.ss-pie{padding:8px 14px;border-top:1px solid color-mix(in srgb,var(--tx) 8%,transparent);font-size:var(--f1);color:var(--tx3);letter-spacing:.02em}
.ss-i.aqui .ss-n{font-weight:700}
.ss-i.aqui::after{content:"";width:6px;height:6px;flex:none;background:var(--acc);margin-left:2px}
/* ================= chat con pestañas (una o lado a lado) ================= */
.scr.chat3.on{display:flex;flex-direction:column;min-height:0}
.ct-bar{display:flex;align-items:flex-end;gap:10px;padding:8px 14px 0 12px;border-bottom:1px solid color-mix(in srgb,var(--tx) 10%,transparent);background:color-mix(in srgb,var(--tx) 2.5%,var(--bg));flex:none}
.ct-tabs{display:flex;align-items:flex-end;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.ct-tabs::-webkit-scrollbar{display:none}
.ct-tab{position:relative;display:inline-flex;align-items:center;gap:8px;max-width:220px;min-width:0;height:36px;padding:0 10px 0 12px;border-radius:10px 10px 0 0;color:var(--tx2);font-size:var(--f3);border:1px solid transparent;border-bottom:0;margin-bottom:-1px;transition:background-color .15s,color .15s}
.ct-tab:hover{background:color-mix(in srgb,var(--tx) 5%,transparent);color:var(--tx)}
.ct-tab.on{background:var(--bg);color:var(--tx);font-weight:650;border-color:color-mix(in srgb,var(--tx) 10%,transparent)}
.ct-tab.on::before{content:"";position:absolute;left:10px;right:10px;top:-1px;height:2px;background:var(--c);border-radius:2px}
.ct-tab.vis:not(.on){color:var(--tx)}
.ct-n{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-tab .eq{flex:none}
.ct-x{display:grid;place-items:center;width:18px;height:18px;flex:none;border-radius:5px;color:var(--tx3);opacity:0;transition:opacity .12s,background-color .12s}
.ct-tab:hover .ct-x,.ct-tab.on .ct-x{opacity:1}
.ct-x:hover{background:color-mix(in srgb,var(--tx) 10%,transparent);color:var(--tx)}
.ct-mas{display:grid;place-items:center;width:30px;height:30px;margin:0 0 3px 4px;flex:none;border-radius:8px;color:var(--tx3);transition:background-color .15s,color .15s}
.ct-mas:hover{background:color-mix(in srgb,var(--tx) 7%,transparent);color:var(--tx)}
.ct-der{display:flex;align-items:center;gap:2px;padding-bottom:3px;flex:none}
.ct-panes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.ct-panes.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ct-panes.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;container:pane/inline-size}
.pane[hidden]{display:none!important}
.ct-panes.lado .pane + .pane{border-left:1px solid color-mix(in srgb,var(--tx) 10%,transparent)}
.ct-panes.lado .pane::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--c);opacity:0;transition:opacity .2s;pointer-events:none}
.ct-panes.lado .pane.foco::after{opacity:1}
.ct-panes.lado .pane:not(.foco) .cvx-box .inbox{box-shadow:none!important}
.ct-vacio{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12vh}
/* encabezado del panel: tres nodos y nada más */
.pn-h{display:flex;align-items:center;gap:8px;padding:10px 16px;flex:none;min-width:0}
.pn-sp{flex:1}
.pn-h .mm-chip{flex:none;max-width:100%}
.pn-h .pill{flex:none}
.mm-chip.cv-chip{background:var(--card);border-color:color-mix(in srgb,var(--tx) 14%,transparent);flex:0 1 auto;min-width:0}
.mm-chip.cv-chip:hover{background:color-mix(in srgb,var(--tx) 4%,var(--card))}
.cv-chip .cvn{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.cv-chip .cva{font-size:var(--f2);color:var(--tx3);font-weight:500;flex:none}
.mm-chip.sk-chip{background:transparent;border-color:color-mix(in srgb,var(--tx) 14%,transparent);font-weight:600}
.mm-chip.sk-chip:hover{background:color-mix(in srgb,var(--tx) 5%,transparent)}
.mm-chip.sk-chip .ic:first-child{color:var(--tx2)}
@container pane (max-width:720px){.pn-h .sk-chip .lb,.pn-h .sk-chip .ic:last-child,.pn-h .cv-chip .cva{display:none}.pn-h .mm-chip.sk-chip{padding-inline:8px}}
@container pane (max-width:520px){.pn-h .mm-cv{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pn-h .pill{display:none}.pn-h{padding:10px 10px;gap:6px}}
@container pane (max-width:600px){.pane .cvx{padding:0 16px}.pane .box{padding:0 14px}.pane .cvx-m.yo .cvx-b{max-width:88%}}
/* composer: una línea limpia, enviar con ícono */
.pane .comp{padding:0 0 14px}
.cvx-box .inbox{display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 4px}
.cvx-box .inbox textarea{flex:1;min-width:0;padding:9px 10px!important;min-height:40px!important}
.cvx-box .inbox .send{margin:0;padding:0;width:38px;height:38px;justify-content:center;flex:none;border-radius:11px;font-size:0}
.cvx-box .inbox .send .ic{width:16px;height:16px}
.cvx-box .cv-err:empty{display:none}
.cvx-box .cv-err{align-self:center;font-size:var(--f2)}
/* el nodo de conversación */
.nc-pop{width:380px;padding:0!important;overflow:hidden}
.nc-qw{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid color-mix(in srgb,var(--tx) 8%,transparent);color:var(--tx3)}
.nc-q{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:var(--f4);color:var(--tx);outline:0}
.nc-s{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;flex-wrap:wrap}
.nc-s > small,.nc-t{font-size:var(--f1);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.nc-t{display:block;padding:10px 14px 4px}
.nc-ags{display:flex;gap:6px;flex-wrap:wrap}
.nc-ag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--tx) 13%,transparent);font-size:var(--f2);color:var(--tx);transition:background-color .15s,border-color .15s,transform .2s cubic-bezier(.22,1,.36,1)}
.nc-ag:hover{background:color-mix(in srgb,var(--c) 12%,transparent);border-color:color-mix(in srgb,var(--c) 50%,transparent);transform:translateY(-1px)}
.nc-ag.on{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:var(--c);font-weight:650}
.nc-l{max-height:min(46vh,380px);overflow:auto;padding:0 6px 6px}
.nc-hint{padding:14px 12px;font-size:var(--f3);color:var(--tx2)}

.cvx-box .caret{left:14px;top:17px;width:8px;height:16px}
/* nodos Agente y Sesión: neutros (el color de acento queda para el motor) */
.mm-chip.ag-chip,.mm-chip.ses-chip{background:var(--card);border-color:color-mix(in srgb,var(--tx) 14%,transparent)}
.mm-chip.ag-chip:hover,.mm-chip.ses-chip:hover{background:color-mix(in srgb,var(--tx) 4%,var(--card))}
.mm-chip.ses-chip{min-width:0;flex:0 1 auto}
.ses-chip .cvn{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.ag-chip .lb2{font-weight:700}
@container pane (max-width:600px){.pn-h .ag-chip .lb2{display:none}.pn-h .mm-chip.ag-chip{padding-inline:9px}}
/* la lista emergente: una lista y ya */
.pl-pop{width:320px;padding:6px!important}
.pl-pop .mm-t{padding:6px 8px 8px}
.pl-l{max-height:min(52vh,420px);overflow:auto}
.pl-new{display:flex;align-items:center;gap:8px;margin:0 0 4px;padding:8px 10px;border-radius:8px;color:var(--acc);font-size:var(--f3);font-weight:650;cursor:pointer;border:1px dashed color-mix(in srgb,var(--acc) 45%,transparent)}
.pl-new:hover{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.pl-new .pl-in{display:none;flex:1;min-width:0;border:0;background:none;font:inherit;font-weight:500;color:var(--tx);outline:0}
.pl-new.on{cursor:text;background:var(--card);border-style:solid}
.pl-new.on span{display:none}
.pl-new.on .pl-in{display:block}

.cvx-m.previo{opacity:.55}
.daysep.ahora{color:var(--acc)}

.sr-pt{font-size:var(--f3);line-height:1.5;margin:6px 0 10px}.sr-pt p{margin:0 0 6px}.sr-pt ul{margin:4px 0 6px;padding-left:18px}

/* usar skill: para qué, dónde y en qué motor */
.sk-pop{width:360px}
.sk-body{display:flex;flex-direction:column;gap:12px;padding:4px 4px 6px}
.sk-in{resize:none;min-height:54px;font:inherit;font-size:var(--f3);border-radius:10px}
.sk-f{display:flex;flex-direction:column;gap:6px}
.sk-f[hidden]{display:none}
.sk-dest,.sk-mot{display:flex;flex-wrap:wrap;gap:6px}
.sk-go{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.sk-save{margin:4px 4px 6px!important}

/* abriendo / cerrada: en claro, como la conversación */
.ch-claro{min-height:min(420px,calc(100vh - 300px))!important}
.ch-claro .ch-msg{color:var(--tx);padding:22px 26px;border-radius:14px;background:var(--card);border:1px solid color-mix(in srgb,var(--tx) 10%,transparent);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.ch-claro .ch-msg span{color:var(--tx2)}
.ch-claro .ch-abre{color:var(--tx)!important}
.ch-claro .ch-abre .eq i{background:var(--acc)!important}
/* ================= panel derecho: Skills ================= */
.rail .rtabs{display:none}
.rv-sk{display:flex;flex-direction:column;gap:8px}
.rs-h small{font-size:var(--f1);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:650}
.rs-q{width:100%;border-radius:10px;font-size:var(--f3)}
.rs-save{margin:0!important}
.rs-l{display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 360px);overflow:auto;margin:0 -4px;padding:0 4px}
.rs-i{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:8px 10px;border-radius:9px;text-align:left;transition:background-color .12s}
.rs-i:hover{background:color-mix(in srgb,var(--card) 85%,transparent)}
.rs-i b{font-size:var(--f3);font-weight:650;color:var(--tx)}
.rs-i small{font-size:var(--f2);color:var(--tx3);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rs-runs{display:flex;flex-direction:column;gap:2px;border-top:1px solid color-mix(in srgb,var(--tx) 8%,transparent);padding-top:6px}
.rs-runs .nc-t{padding:4px 2px}
.rs-run{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;text-align:left;font-size:var(--f3)}
.rs-run:hover{background:color-mix(in srgb,var(--card) 85%,transparent)}
.rs-run span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-run small{font-size:var(--f1);color:var(--tx3);flex:none}
.rs-dot{width:7px;height:7px;flex:none;background:color-mix(in srgb,var(--tx) 25%,transparent)}
.rs-dot.ok{background:#3fae7a}.rs-dot.run{background:var(--acc);animation:pu 1.2s infinite}
.rs-volver{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-bottom:6px;padding:4px 8px;border-radius:8px;font-size:var(--f2);color:var(--tx2)}
.rs-volver:hover{background:color-mix(in srgb,var(--tx) 6%,transparent);color:var(--tx)}
/* responder a lo que pide la skill: caja que crece */
.sr-resp{width:100%;resize:none;min-height:56px;max-height:220px;font:inherit;font-size:var(--f3);line-height:1.45;border-radius:10px;padding:9px 11px}
.sr-go{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.sr-go .sr-est{flex:1;min-width:0}
/* ================= empezar de cero ================= */
.pane-ini{overflow:auto}
.ini0{width:min(760px,100%);margin:0 auto;padding:6vh 24px 40px;display:flex;flex-direction:column;gap:18px}
.ini0-h{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ini0-h b{font-family:var(--pxt);font-size:20px;letter-spacing:.04em;color:var(--tx)}
.ini0-h small{font-size:var(--f3);color:var(--tx3)}
.ini0-ags{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.ini0-ag{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 14px 12px;border-radius:14px;background:var(--card);border:1px solid color-mix(in srgb,var(--tx) 11%,transparent);text-align:left;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .2s,background-color .2s}
.ini0-ag:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.ini0-ag.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.ini0-mca{width:14px;height:14px;background:var(--c);margin-bottom:6px;box-shadow:3px 3px 0 color-mix(in srgb,var(--c) 35%,transparent)}
.ini0-ag.on .ini0-mca{animation:ini0pulso 1.6s steps(4) infinite}
@keyframes ini0pulso{50%{box-shadow:5px 5px 0 color-mix(in srgb,var(--c) 30%,transparent)}}
.ini0-ag b{font-size:var(--f4);font-weight:700}
.ini0-ag small{font-size:var(--f2);color:var(--tx3);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ini0-ok{position:absolute;top:10px;right:10px;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff}
.ini0-mot,.ini0-sk,.ini0-re{display:flex;flex-direction:column;gap:7px}
.ini0-mot>small,.ini0-sk>small,.ini0-re>small{font-size:var(--f1);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:650}
.ini0-mchips,.ini0-skchips{display:flex;flex-wrap:wrap;gap:6px}
.ini0-caja{max-width:none!important;padding:0!important}
.ini0-box textarea{min-height:64px!important;font-size:var(--f4)!important}
.ini0-go{width:auto!important;padding:0 14px!important;gap:8px;font-size:var(--f3)!important;font-weight:700}
.ini0-skc{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid color-mix(in srgb,var(--tx) 12%,transparent);font-size:var(--f2);transition:transform .2s cubic-bezier(.22,1,.36,1),border-color .2s,background-color .2s}
.ini0-skc:hover{transform:translateY(-2px);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.ini0-skc .ic{color:var(--acc)}
.ini0-skc.fij{border-color:color-mix(in srgb,var(--yel) 60%,transparent)}.ini0-skc.fij .ic{color:#c99a1c}
.ini0-skc.mas{color:var(--tx2)}
.ini0-nada{font-size:var(--f2);color:var(--tx3)}
.ini0-rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.ini0-r{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid color-mix(in srgb,var(--tx) 8%,transparent);text-align:left;transition:background-color .15s,transform .2s}
.ini0-r:hover{background:var(--card);transform:translateY(-1px)}
.ini0-r b{flex:1;min-width:0;font-size:var(--f3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ini0-r small{font-size:var(--f1);color:var(--tx3)}
.ini0-rd{width:7px;height:7px;flex:none;background:color-mix(in srgb,var(--tx) 22%,transparent)}
/* ================= la caja: adjuntar, dictar, skill del chat ================= */
.cvx-box .inbox{flex-direction:column;align-items:stretch!important;gap:2px!important;padding:6px 6px 6px 6px!important}
.cvx-box .inbox textarea{width:100%}
.cj-bar{display:flex;align-items:center;gap:4px;padding:0 0 0 2px}
.cj-b{position:relative;display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:var(--tx3);transition:background-color .15s,color .15s,transform .2s}
.cj-b:hover{background:color-mix(in srgb,var(--tx) 7%,transparent);color:var(--tx);transform:translateY(-1px)}
.cj-file{display:none}
.cj-voz.on{color:#fff;background:#d94b3d}
.cj-ondas{position:absolute;inset:auto 4px 3px auto;display:none;gap:1px;align-items:flex-end;height:8px}
.cj-ondas i{width:2px;background:#fff;animation:onda .7s steps(3) infinite}
.cj-ondas i:nth-child(2){animation-delay:.15s}.cj-ondas i:nth-child(3){animation-delay:.3s}
.cj-voz.on .cj-ondas{display:flex}
.cj-voz.on .ic{opacity:.25}
@keyframes onda{0%{height:2px}50%{height:8px}100%{height:4px}}
.cj-adj{display:flex;flex-wrap:wrap;gap:6px;padding:4px 6px 0}
.cj-adj[hidden]{display:none}
.cj-chip{display:inline-flex;align-items:center;gap:6px;max-width:240px;padding:4px 6px 4px 9px;border-radius:8px;background:color-mix(in srgb,var(--acc) 9%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);font-size:var(--f2)}
.cj-chip span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cj-chip.sub{opacity:.75}.cj-chip.mal{background:color-mix(in srgb,#d94b3d 10%,var(--card));border-color:#d94b3d}
.cj-x{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;color:var(--tx3)}.cj-x:hover{background:color-mix(in srgb,var(--tx) 8%,transparent);color:var(--tx)}
.inbox.soltar{outline:2px dashed var(--acc);outline-offset:3px}
.cj-skw{display:inline-flex;align-items:stretch;margin-left:4px;border-radius:999px;border:1px dashed color-mix(in srgb,var(--tx) 22%,transparent);overflow:hidden;transition:border-color .2s,background-color .2s,box-shadow .2s}
.cj-skw.set{border-style:solid;border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.cj-skw.on{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.cj-sk,.cj-skv{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-size:var(--f2);font-weight:650;color:var(--tx2)}
.cj-skv{padding:4px 7px;border-left:1px solid color-mix(in srgb,var(--tx) 12%,transparent)}
.cj-skw.set .cj-sk{color:var(--tx)}.cj-skw.set .cj-sk .ic{color:var(--acc)}
.cj-skw.on .cj-sk,.cj-skw.on .cj-skv,.cj-skw.on .cj-sk .ic{color:#fff}
.cj-skw.on .cj-sk .ic{animation:zap 1s steps(2) infinite}
@keyframes zap{50%{opacity:.45}}
.cj-skw:hover{border-color:var(--acc)}
.inbox.con-skill{box-shadow:0 0 0 2px var(--acc),0 6px 18px color-mix(in srgb,var(--acc) 18%,transparent)!important}
.cvx-box .inbox .send.sk{width:auto;padding:0 14px;gap:8px;font-size:var(--f3);font-weight:700}
.send-l:empty{display:none}
/* ================= skills: tarjetas ================= */
.rs-h{display:flex;align-items:center;gap:8px}.rs-h .mca{background:var(--c)}
.rs-h b{font-size:var(--f3);font-weight:700}
.rs-sep{display:block;padding:8px 4px 2px;font-size:var(--f1);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:650}
.rs-i{position:relative;display:flex;flex-direction:column;gap:4px;padding:10px 11px;border-radius:11px;background:color-mix(in srgb,var(--card) 55%,transparent);border:1px solid transparent;cursor:pointer;transition:background-color .15s,border-color .15s,transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s}
.rs-i:hover{background:var(--card);border-color:color-mix(in srgb,var(--tx) 10%,transparent);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.06)}
.rs-i.fij{border-color:color-mix(in srgb,var(--yel) 55%,transparent)}
.rs-i.chat{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card))}
.rs-t{display:flex;align-items:center;gap:6px}.rs-t b{flex:1;min-width:0;font-size:var(--f3);font-weight:700}
.rs-acts{display:flex;gap:6px;max-height:0;opacity:0;overflow:hidden;transition:max-height .25s cubic-bezier(.22,1,.36,1),opacity .2s,margin .2s}
.rs-i:hover .rs-acts,.rs-i:focus-within .rs-acts,.rs-i.chat .rs-acts{max-height:34px;opacity:1;margin-top:4px}
.rs-a{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:var(--f1);font-weight:700;border:1px solid color-mix(in srgb,var(--tx) 14%,transparent);color:var(--tx2);background:var(--bg)}
.rs-a:hover{color:var(--tx);border-color:var(--tx3)}
.rs-a.p{background:var(--acc);border-color:var(--acc);color:#fff}
.rs-a.on{border-color:var(--acc);color:var(--acc)}
.sk-star{display:grid;place-items:center;width:22px;height:22px;flex:none;border-radius:6px;color:color-mix(in srgb,var(--tx) 28%,transparent);transition:color .15s,background-color .15s}
.sk-star:hover{color:#c99a1c;background:color-mix(in srgb,var(--yel) 18%,transparent)}
.sk-star.on{color:#c99a1c}.sk-star.on .ic{fill:currentColor}
.sk-fila{display:flex;align-items:center;gap:8px;cursor:pointer}.sk-fila>.ic{color:var(--acc)}
.ini0-caja{margin:0!important;width:100%}

/* el inicio dice dónde cae lo que escribes */
.ini0-dest{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-10px;padding:0 6px;font-size:var(--f2);color:var(--tx3)}
.ini0-dl{display:inline-flex;align-items:center;gap:6px;min-width:0}
.ini0-dl b{color:var(--tx);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.ini0-dx{display:inline-flex;align-items:center;gap:5px;flex:none;padding:3px 8px;border-radius:7px;color:var(--tx2);font-size:var(--f2)}
.ini0-dx:hover{background:color-mix(in srgb,var(--tx) 6%,transparent);color:var(--tx)}

/* ================= la pregunta de la terminal, en el chat ================= */
.pq{margin:4px 0 10px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--yel) 14%,var(--card));border:1px solid color-mix(in srgb,#c99a1c 45%,transparent);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.pq-h{display:flex;align-items:center;gap:8px;font-size:var(--f2);text-transform:uppercase;letter-spacing:.08em;color:#9a6a0c}
.pq-h b{font-weight:700}
.pq-t{margin:8px 0 4px;font-size:var(--f4);font-weight:650;color:var(--tx)}
.pq-d{display:block;font-family:var(--mono);font-size:11.5px;color:var(--tx2);line-height:1.5;word-break:break-word}
.pq-ops{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.pq-o{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--card);border:1px solid color-mix(in srgb,var(--tx) 12%,transparent);text-align:left;font-size:var(--f3);transition:transform .18s cubic-bezier(.22,1,.36,1),border-color .15s,background-color .15s}
.pq-o:hover{transform:translateX(3px);border-color:var(--acc)}
.pq-o em{display:grid;place-items:center;width:22px;height:22px;flex:none;border-radius:6px;font-style:normal;font-weight:700;font-size:var(--f2);background:color-mix(in srgb,var(--tx) 8%,transparent)}
.pq-o.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.pq-o.sel em{background:var(--acc);color:#fff}
.pq-o:disabled{opacity:.55}.pq-o.enviando{opacity:1;border-color:var(--acc)}
.pq-pie{display:flex;justify-content:flex-end;margin-top:8px}
/* el aviso «haz clic para escribir» de la terminal: arriba, chico, y se va solo */
.term-hint{top:10px!important;bottom:auto!important;right:12px!important;left:auto!important;transform:none!important;font-size:11.5px!important;padding:4px 10px!important;opacity:.9;transition:opacity .4s}
.term-hint.fuera{opacity:0;pointer-events:none}
/* encabezado angosto: el agente nunca se esconde; primero se van el estado y las etiquetas */
@container pane (max-width:600px){.pn-h .ag-chip .lb2{display:inline!important}.pn-h .mm-chip.ag-chip{padding-inline:10px!important}.pn-h .pill{display:none}.pn-h .ses-chip .cvn{max-width:110px}}
@container pane (max-width:470px){.pn-h .mo-chip .mm-cv{display:none}.pn-h .ses-chip .cvn{max-width:80px}}
.cvx-ban{max-width:760px;margin:0 auto;padding:0 24px}
.cvx-ban:empty{display:none}
/* panel angosto: el encabezado baja a dos renglones en vez de aplastar los nodos */
@container pane (max-width:520px){
  .pn-h{flex-wrap:wrap;row-gap:6px}
  .pn-h .pn-sp{flex:1 0 0}
  .pn-h .ses-chip{flex:1 1 120px}
  .pn-h .ses-chip .cvn{max-width:none}
  .pn-h .mo-chip .mm-cv{display:inline!important}
  .cvx-h summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cvx-h .cvx-h1{display:none}
}
.cvx-h summary{white-space:nowrap}

/* ================= subagentes ================= */
.sub-lz,.sub-card{margin:8px 0;padding:10px 12px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--c,var(--acc)) 50%,transparent);background:color-mix(in srgb,var(--c,var(--acc)) 6%,var(--card))}
.sub-card{border-style:solid;margin:4px 0 10px}
.sub-h{display:flex;align-items:center;gap:8px;font-size:var(--f2);font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em}
.sub-ic{width:12px;height:12px;flex:none;background:linear-gradient(var(--c,var(--acc)) 0 0) 0 0/5px 5px no-repeat,linear-gradient(var(--c,var(--acc)) 0 0) 7px 0/5px 5px no-repeat,linear-gradient(var(--c,var(--acc)) 0 0) 0 7px/5px 5px no-repeat,linear-gradient(color-mix(in srgb,var(--c,var(--acc)) 45%,transparent) 0 0) 7px 7px/5px 5px no-repeat}
.sub-ic.vivo{animation:subgira 1.2s steps(4) infinite}
@keyframes subgira{to{transform:rotate(360deg)}}
.sub-r{display:flex;align-items:baseline;gap:8px;margin-top:6px;font-size:var(--f3);min-width:0}
.sub-r .eq{flex:none;align-self:center}
.sub-r b{flex:none;font-weight:700;font-size:var(--f2);padding:1px 7px;border-radius:6px;background:color-mix(in srgb,var(--tx) 7%,transparent)}
.sub-r span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-r small{flex:none;font-size:var(--f1);color:var(--tx3);font-family:var(--mono)}
.sub-pt{width:6px;height:6px;flex:none;background:var(--c,var(--acc));align-self:center}
.pill-sub{font-weight:600}

.pq-ok{display:flex;align-items:center;gap:8px;margin:4px 0 10px;padding:9px 14px;border-radius:12px;background:color-mix(in srgb,#3fae7a 12%,var(--card));border:1px solid color-mix(in srgb,#3fae7a 40%,transparent);font-size:var(--f3);color:var(--tx);overflow:hidden}
.pq-ok .ic{color:#2f8f62}

/* pestañas: el nombre siempre se lee; la vacía con cuadrito punteado; arrastrar para ordenar */
.ct-tab{flex:0 1 auto;min-width:104px}
.ct-vac{background:transparent!important;border:1.5px dashed color-mix(in srgb,var(--tx) 45%,transparent)}
.ct-tab[draggable=true]{cursor:grab}
.ct-tab.arrastrando{opacity:.45}
.ct-tab.antes{box-shadow:inset 3px 0 0 var(--acc)}
.ct-tab.despues{box-shadow:inset -3px 0 0 var(--acc)}
.ct-bar>.ct-mas{margin-left:2px}

/* ================= límites y gasto ================= */
.uso-chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;font-size:var(--f2);font-weight:650;color:var(--tx2);background:color-mix(in srgb,var(--tx) 5%,transparent);border:1px solid color-mix(in srgb,var(--tx) 10%,transparent);flex:none;transition:background-color .15s}
.uso-chip:hover{background:color-mix(in srgb,var(--tx) 9%,transparent)}
.uso-chip.ambar{color:#9a6a0c;border-color:color-mix(in srgb,#c99a1c 45%,transparent)}
.uso-chip.rojo{color:#b13a2c;border-color:color-mix(in srgb,#d94b3d 50%,transparent);background:color-mix(in srgb,#d94b3d 8%,transparent)}
.uso-b{position:relative;display:inline-block;width:34px;height:6px;background:color-mix(in srgb,var(--tx) 12%,transparent);overflow:hidden}
.uso-b>i{position:absolute;left:0;top:0;bottom:0;background:#3fae7a;background-image:linear-gradient(90deg,transparent 0 3px,rgba(255,255,255,.35) 3px 4px);background-size:4px 100%}
.uso-b.ambar>i{background-color:#d6a52a}.uso-b.rojo>i{background-color:#d94b3d}
.uso-b.grande{width:120px;height:8px}
.uso-g{font-family:var(--mono);font-size:11px;color:var(--tx3)}
.uso-pop{width:280px;padding:6px 6px 10px!important}
.uso-f{display:grid;grid-template-columns:1fr auto 38px;align-items:center;gap:10px;padding:7px 8px;font-size:var(--f3)}
.uso-f b{text-align:right;font-family:var(--mono);font-size:12px}
.uso-n{padding:4px 8px;font-size:var(--f2);color:var(--tx2)}
.uso-pie{padding:8px 8px 0;font-size:var(--f1);color:var(--tx3);border-top:1px solid color-mix(in srgb,var(--tx) 8%,transparent);margin-top:6px}
@container pane (max-width:600px){.uso-chip span:not(.uso-g){display:none}}

/* encabezado mediano: la sesión nunca se aplasta a nada; antes de eso, baja a dos renglones */
.pn-h .ses-chip{min-width:92px}
@container pane (max-width:700px){
  .pn-h{flex-wrap:wrap;row-gap:6px}
  .pn-h .pn-sp{flex:1 0 0}
  .pn-h .ses-chip{flex:1 1 120px}
  .pn-h .ses-chip .cvn{max-width:none}
}

/* ================= contraste y detalles pixel (todas las secciones) ================= */
/* la banda del encabezado */
.scr:not(.chat3) .th.banda{position:relative;height:auto;min-height:86px;padding:16px 26px 22px;gap:16px;background:var(--K,#0f3440);color:#fff;border-bottom:0;
  background-image:radial-gradient(color-mix(in srgb,#fff 10%,transparent) 1px,transparent 1.2px);background-size:9px 9px}
.scr:not(.chat3) .th.banda::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;pointer-events:none;
  background:linear-gradient(90deg,var(--K,#0f3440) 50%,transparent 50%) 0 0/8px 3px repeat-x,linear-gradient(90deg,transparent 50%,var(--K,#0f3440) 50%) 0 3px/8px 3px repeat-x}
.banda-emb{display:grid;place-items:center;width:58px;height:58px;flex:none;border-radius:12px;background:color-mix(in srgb,#fff 9%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,#fff 16%,transparent)}
.banda-emb canvas{image-rendering:pixelated}
body.fx-e .banda-emb canvas{animation:embflota 3.2s steps(4) infinite}
@keyframes embflota{50%{transform:translateY(-2px)}}
.th.banda h1{color:#fff;font-size:22px;letter-spacing:.01em}
.th.banda .meta,.th.banda .meta .pill{color:color-mix(in srgb,#fff 70%,transparent)}
.th.banda .acts .ib{background:#fff;color:var(--K,#0f3440);border-color:#fff}
.th.banda .acts .ib:hover{background:var(--X,#e2583e);border-color:var(--X,#e2583e);color:#fff}
.th.banda .inw{background:color-mix(in srgb,#fff 12%,transparent);border-color:color-mix(in srgb,#fff 25%,transparent);color:#fff}
.th.banda .inw input{color:#fff}.th.banda .inw input::placeholder{color:color-mix(in srgb,#fff 60%,transparent)}
.scr:not(.chat3) .pg{padding-top:30px}
/* tarjetas: barra de título con foquitos, borde más firme, sombra pixel al pasar */
.scr:not(.chat3) .card{border:1.5px solid color-mix(in srgb,var(--K,#0f3440) 28%,transparent)!important;box-shadow:3px 3px 0 color-mix(in srgb,var(--K,#0f3440) 10%,transparent)!important;transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s!important;overflow:hidden}
.scr:not(.chat3) .card:hover{transform:translate(-1px,-1px)!important;box-shadow:5px 5px 0 color-mix(in srgb,var(--K,#0f3440) 16%,transparent)!important}
.scr:not(.chat3) .card>.hd{margin:-1px -1px 0;padding:10px 16px;background:color-mix(in srgb,var(--K,#0f3440) 7%,var(--card));border-bottom:1.5px solid color-mix(in srgb,var(--K,#0f3440) 16%,transparent);font-weight:700;color:var(--K,#0f3440)}
/* filas clicables: se notan */
.scr:not(.chat3) .li.click{position:relative;transition:background-color .15s,padding-left .2s cubic-bezier(.22,1,.36,1)}
.scr:not(.chat3) .li.click:hover{background:color-mix(in srgb,var(--X,#e2583e) 6%,transparent);padding-left:6px}
.scr:not(.chat3) .li.click:hover::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--X,#e2583e)}
/* botones: borde firme y un «paso» pixel al pasar */
.ib{transition:transform .15s cubic-bezier(.22,1,.36,1),box-shadow .15s,background-color .15s}
.ib:not(:disabled):hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 color-mix(in srgb,var(--K,#0f3440) 22%,transparent)}
.ib:not(:disabled):active{transform:translate(1px,1px);box-shadow:none}
/* barra de título de las tarjetas: tinta sólida, como una ventana pixel */
.scr:not(.chat3) .card>.hd{background:var(--K,#0f3440)!important;color:#fff!important;border-bottom:0!important;padding:9px 14px!important;margin:0!important;border-radius:0}
.scr:not(.chat3) .card>.hd .r{color:color-mix(in srgb,#fff 65%,transparent)!important}
.scr:not(.chat3) .card>.hd .vent{animation-name:leds!important}
.scr:not(.chat3) .card>.bd{padding-top:6px}
.scr:not(.chat3) .stat,.scr:not(.chat3) .kpi{border:1.5px solid color-mix(in srgb,var(--K,#0f3440) 28%,transparent)!important;box-shadow:3px 3px 0 color-mix(in srgb,var(--K,#0f3440) 10%,transparent)!important}

/* ================= Estado: te esperan + mesas de agentes ================= */
.wrap.es{display:flex;flex-direction:column;gap:18px}
.es-espera{border-radius:16px;padding:16px 18px;background:var(--card);border:2px solid var(--X,#e2583e);box-shadow:4px 4px 0 color-mix(in srgb,var(--X,#e2583e) 25%,transparent)}
.es-espera.vacia{border-color:color-mix(in srgb,#3fae7a 55%,transparent);box-shadow:4px 4px 0 color-mix(in srgb,#3fae7a 18%,transparent)}
.es-eh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.es-eh b{font-size:var(--f4);font-weight:800;color:var(--K,#0f3440)}
.es-eh em{font-style:normal;font-weight:800;font-size:var(--f2);min-width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:var(--X,#e2583e);color:#fff}
.es-eh em:empty{display:none}
.es-campana{width:14px;height:14px;background:linear-gradient(var(--K,#0f3440) 0 0) 4px 0/6px 2px no-repeat,linear-gradient(var(--K,#0f3440) 0 0) 2px 2px/10px 8px no-repeat,linear-gradient(var(--K,#0f3440) 0 0) 0 10px/14px 2px no-repeat,linear-gradient(var(--X,#e2583e) 0 0) 6px 12px/2px 2px no-repeat}
.es-campana.viva{animation:campana .9s steps(2) infinite}
@keyframes campana{50%{transform:rotate(-12deg)}}
.es-nada{display:flex;align-items:center;gap:8px;color:#2f8f62;font-size:var(--f3);font-weight:600}
.es-item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px dashed color-mix(in srgb,var(--tx) 14%,transparent)}
.es-item .mca{width:12px;height:12px;flex:none;background:var(--c)}
.es-it{flex:1;min-width:0}
.es-it small{display:block;font-size:var(--f2);color:var(--tx3)}
.es-it small b{color:var(--tx);font-weight:700}
.es-it p{margin:2px 0 0;font-size:var(--f3);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es-t{display:flex;align-items:baseline;gap:10px;margin:6px 0 -4px;font-size:15px;font-weight:800;color:var(--K,#0f3440);text-transform:uppercase;letter-spacing:.06em}
.es-t small{font-size:var(--f2);font-weight:500;color:var(--tx3);text-transform:none;letter-spacing:0}
.es-mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.es-mesa{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--K,#0f3440) 22%,transparent);box-shadow:3px 3px 0 color-mix(in srgb,var(--K,#0f3440) 9%,transparent);transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s}
.es-mesa:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 color-mix(in srgb,var(--c) 35%,transparent)}
.es-mesa.trabaja{border-color:var(--c)}
.es-mesa.pregunta{border-color:var(--X,#e2583e);box-shadow:4px 4px 0 color-mix(in srgb,var(--X,#e2583e) 25%,transparent)}
.es-mon{position:relative;align-self:flex-start;padding:6px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.es-mon canvas{display:block;image-rendering:pixelated}
.es-mesa.libre .es-mon{filter:grayscale(.6) opacity(.75)}
.es-scan{position:absolute;left:10px;right:10px;top:12px;height:3px;background:color-mix(in srgb,#fff 80%,transparent);animation:escan 1.4s steps(6) infinite}
@keyframes escan{from{transform:translateY(0)}to{transform:translateY(18px)}}
.es-mt{display:flex;align-items:baseline;gap:8px}
.es-mt b{font-size:var(--f4);font-weight:800}
.es-mt small{font-size:var(--f1);color:var(--tx3);font-family:var(--mono)}
.es-ml{display:flex;align-items:center;gap:6px;margin:0;font-size:var(--f2);color:var(--tx2);min-height:18px}
.es-ml span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es-mesa.pregunta .es-ml{color:var(--X,#e2583e);font-weight:700}
.es-uso{display:flex;align-items:center;gap:8px;min-height:14px}
.es-uso small{font-size:var(--f1);color:var(--tx3)}
.es-mesa>.ib{align-self:flex-start;margin-top:4px}
.es-abajo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.es-abajo>div{display:flex;flex-direction:column;gap:14px}
@media (max-width:1100px){.es-abajo{grid-template-columns:1fr}}

/* ================= Conversaciones (salas) ================= */
.pg.sl2{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0;padding:0!important;min-height:0;overflow:hidden}
.sl2-l{display:flex;flex-direction:column;gap:10px;min-height:0;padding:18px 14px 14px 18px;border-right:1.5px solid color-mix(in srgb,var(--K,#0f3440) 14%,transparent);background:color-mix(in srgb,var(--K,#0f3440) 3%,transparent)}
.sl2-qw{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:10px;background:var(--card);border:1px solid color-mix(in srgb,var(--tx) 12%,transparent);color:var(--tx3)}
.sl2-q{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:var(--f3);color:var(--tx);outline:0}
.sl2-seg{display:flex;gap:4px;padding:3px;border-radius:10px;background:color-mix(in srgb,var(--tx) 6%,transparent)}
.sl2-seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:8px;font-size:var(--f2);font-weight:650;color:var(--tx2)}
.sl2-seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sl2-seg em{font-style:normal;font-size:var(--f1);color:var(--tx3)}
.sl2-lista{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:0 -4px;padding:2px 4px}
.sl2-li{position:relative;display:flex;flex-direction:column;gap:4px;width:100%;padding:10px 12px;border-radius:12px;text-align:left;border:1.5px solid transparent;transition:background-color .15s,border-color .15s,transform .2s cubic-bezier(.22,1,.36,1)}
.sl2-li:hover{background:var(--card);transform:translateX(2px)}
.sl2-li.on{background:var(--card);border-color:var(--K,#0f3440);box-shadow:3px 3px 0 color-mix(in srgb,var(--K,#0f3440) 14%,transparent)}
.sl2-lt{display:flex;align-items:center;gap:8px;min-width:0}
.sl2-lt b{flex:1;min-width:0;font-size:var(--f3);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl2-lt small{flex:none;font-size:var(--f1);color:var(--tx3)}
.sl2-pila{display:inline-flex;flex:none}
.sl2-pila i{width:10px;height:10px;background:var(--c);margin-right:-3px;box-shadow:0 0 0 2px var(--card)}
.sl2-ls{font-size:var(--f2);color:var(--tx3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.sl2-r{display:flex;flex-direction:column;min-width:0;min-height:0}
.sl2-vacio{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;height:100%}
.sl2-vacio canvas{image-rendering:pixelated}
.sl2-h{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1.5px solid color-mix(in srgb,var(--K,#0f3440) 12%,transparent);flex:none}
.sl2-ht{display:flex;flex-direction:column;min-width:0}
.sl2-ht b{font-size:var(--f5,17px);font-weight:800}
.sl2-ht span{font-size:var(--f2);color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl2-ps{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.sl2-p{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);font-size:var(--f2)}
.sl2-p .mca{width:9px;height:9px;background:var(--c)}
.sl2-p small{color:var(--tx3);font-size:var(--f1)}
.sl2-p.o{opacity:.6}
.sl2-f{flex:1;min-height:0;overflow:auto;padding:18px 0 10px}
.sl2-col{max-width:780px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:4px}
.sl2-dia{display:flex;justify-content:center;margin:14px 0 8px}
.sl2-dia span{padding:3px 12px;border-radius:999px;background:color-mix(in srgb,var(--K,#0f3440) 8%,transparent);font-size:var(--f1);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
.sl2-m{display:flex;flex-direction:column;align-items:flex-start;margin-top:10px}
.sl2-m.seg{margin-top:3px}
.sl2-m.mio{align-items:flex-end}
.sl2-q{display:flex;align-items:center;gap:7px;margin:0 0 4px 2px;font-size:var(--f2)}
.sl2-q .mca{width:10px;height:10px;background:var(--c)}
.sl2-q b{color:var(--c,var(--tx));font-weight:800}
.sl2-m.mio .sl2-q b{color:var(--X,#e2583e)}
.sl2-q em{font-style:normal;font-size:var(--f1);font-weight:800;letter-spacing:.06em;padding:1px 7px;border-radius:5px;background:color-mix(in srgb,var(--yel) 40%,transparent);color:#7a5408;text-transform:uppercase}
.sl2-m.resp .sl2-q em{background:color-mix(in srgb,#3fae7a 22%,transparent);color:#24704c}
.sl2-q small{color:var(--tx3);font-size:var(--f1)}
.sl2-b{max-width:88%;padding:10px 14px;border-radius:4px 14px 14px 14px;background:var(--card);border:1px solid color-mix(in srgb,var(--tx) 9%,transparent);border-left:3px solid var(--c,var(--tx3));font-size:var(--f3);line-height:1.55}
.sl2-m.mio .sl2-b{border-radius:14px 4px 14px 14px;border-left:1px solid color-mix(in srgb,var(--X,#e2583e) 30%,transparent);border-right:3px solid var(--X,#e2583e);background:color-mix(in srgb,var(--X,#e2583e) 8%,var(--card))}
.sl2-m.pide .sl2-b{background:color-mix(in srgb,var(--yel) 12%,var(--card))}
.sl2-tx p{margin:0 0 6px}.sl2-tx p:last-child{margin:0}
.sl2-tx.plegado{max-height:10.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.sl2-mas{margin-top:6px;font-size:var(--f2);font-weight:700;color:var(--X,#e2583e)}
.sl2-c{flex:none;padding:8px 24px 16px}
.sl2-c .cvx-box{max-width:780px;margin:0 auto}
.sl2-dest{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sl2-dest small{font-size:var(--f1);color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-right:2px}
.sl2-d{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--tx) 13%,transparent);font-size:var(--f2);font-weight:650}
.sl2-d .mca{width:9px;height:9px;background:var(--c)}
.sl2-d.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.sl2-cerrada{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;color:var(--tx3);font-size:var(--f3)}
.scr.on:has(.pg.sl2){overflow:hidden}
.sl2-q b{color:var(--tx)!important}
.sl2-m.mio .sl2-q b{color:var(--tx)!important}

/* ================= Ajustes ================= */
.pg.aj2{display:grid;grid-template-columns:190px minmax(0,1fr);gap:26px;align-items:start}
.aj2-nav{position:sticky;top:0;display:flex;flex-direction:column;gap:2px;padding-top:4px}
.aj2-nav button{text-align:left;padding:8px 12px;border-radius:9px;font-size:var(--f3);color:var(--tx2);font-weight:600;transition:background-color .15s,color .15s}
.aj2-nav button:hover{background:color-mix(in srgb,var(--tx) 6%,transparent);color:var(--tx)}
.aj2-nav button.on{background:var(--K,#0f3440);color:#fff}
.aj2-c{display:flex;flex-direction:column;gap:18px;max-width:900px;padding-bottom:40vh}
.aj2-s{padding:18px 20px;border-radius:16px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--K,#0f3440) 22%,transparent);box-shadow:3px 3px 0 color-mix(in srgb,var(--K,#0f3440) 9%,transparent);scroll-margin-top:14px}
.aj2-sh{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.aj2-sh b{font-size:16px;font-weight:800;color:var(--K,#0f3440)}
.aj2-sh small{font-size:var(--f2);color:var(--tx3)}
.aj2-f{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 0;border-top:1px dashed color-mix(in srgb,var(--tx) 13%,transparent)}
.aj2-sh+.aj2-f{border-top:0}
.aj2-ft{display:flex;flex-direction:column;gap:2px;min-width:0}
.aj2-ft b{font-size:var(--f3);font-weight:700}
.aj2-ft small{font-size:var(--f2);color:var(--tx3)}
.aj2-seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:11px;background:color-mix(in srgb,var(--tx) 6%,transparent);flex:none;max-width:560px}
.aj2-seg button{padding:6px 12px;border-radius:8px;font-size:var(--f2);font-weight:650;color:var(--tx2);transition:background-color .15s,color .15s}
.aj2-seg button:hover{color:var(--tx)}
.aj2-seg button.on{background:var(--K,#0f3440);color:#fff;box-shadow:2px 2px 0 color-mix(in srgb,var(--X,#e2583e) 55%,transparent)}
.aj2-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:560px}
.aj2-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--tx) 14%,transparent);font-size:var(--f2);font-weight:600;color:var(--tx2)}
.aj2-chip i{width:9px;height:9px;border:1.5px solid currentColor}
.aj2-chip.on{border-color:var(--X,#e2583e);color:var(--tx)}
.aj2-chip.on i{background:var(--X,#e2583e);border-color:var(--X,#e2583e)}
.aj2-grupo{display:block;margin:14px 0 6px;font-size:var(--f1);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.aj2-temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:8px}
.aj2-t{position:relative;display:flex;flex-direction:column;gap:6px;padding:7px;border-radius:11px;border:1.5px solid color-mix(in srgb,var(--tx) 12%,transparent);text-align:left;transition:transform .2s cubic-bezier(.22,1,.36,1),border-color .15s,box-shadow .2s}
.aj2-t:hover{transform:translate(-1px,-2px);box-shadow:3px 3px 0 color-mix(in srgb,var(--K,#0f3440) 14%,transparent)}
.aj2-t i{display:flex;height:22px;border-radius:6px;overflow:hidden}
.aj2-t u{flex:1;text-decoration:none}
.aj2-t u:last-child{flex:.6}
