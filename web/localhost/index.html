<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace</title><style>
@font-face{font-family:'WS Pixel';src:url(/ws-pixel.woff2) format('woff2');font-display:block}

:root{--px:'WS Pixel','SF Mono',ui-monospace,monospace;--pxt:var(--px);--mono:'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
 --bw:2px;--bw2:1.5px;--rad:0px;--rad2:0px;--sh0:1px 1px 0 var(--shadow);--sh1:2px 2px 0 var(--shadow);--sh2:3px 3px 0 var(--shadow);--sh3:4px 4px 0 var(--shadow);--sa0:1px 1px 0 var(--acc);--sa2:3px 3px 0 var(--acc);--sa3:4px 4px 0 var(--acc);
 --face1:#b8a6f2;--face2:#8fd6e4;--t-dec:#d9cff7;--t-pen:#ffe27a;--t-hec:#bfe8cf;--ok:#1d8a57;--cy:#1a7fae;--code-tx:#efeaf8}
/* ---- 8 paletas ---- */

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.35;mix-blend-mode:multiply;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .4 0 0 0 0 .32 0 0 0 .22 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.pxi{width:16px;height:16px;image-rendering:pixelated;display:block;flex:none}
canvas{image-rendering:pixelated}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;display:grid;grid-template-columns:240px minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr);height:100%}
/* trama pixel en tinta (borde de la portada del sitio, en papel) */
.dith{height:8px;color:var(--tx);background:
 linear-gradient(90deg,currentColor 50%,transparent 50%) 0 0/4px 2px repeat-x,
 linear-gradient(90deg,transparent 50%,currentColor 50%) 0 2px/4px 2px repeat-x,
 linear-gradient(90deg,currentColor 25%,transparent 25%) 0 4px/8px 2px repeat-x,
 linear-gradient(90deg,currentColor 12.5%,transparent 12.5%) 0 6px/16px 2px repeat-x;opacity:.8}
/* barra lateral */
.side{background:var(--side);border-right:var(--bw) solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:var(--bw) solid var(--line)}
.brand canvas{width:22px;height:22px}
.brand b{font-family:var(--px);font-size:17px;font-weight:400;letter-spacing:.04em;color:var(--tx);text-shadow:2px 2px 0 var(--acc)}
.brand b i{display:inline-block;width:8px;height:3px;background:var(--tx);margin-left:3px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.navs{flex:1;overflow:auto;padding:4px 12px}
.gl{font-family:var(--px);font-size:9px;letter-spacing:.14em;color:var(--tx3);margin:18px 8px 8px}
.nv{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;font-size:13.5px;color:var(--tx2);margin-bottom:2px;border:var(--bw) solid transparent}
.nv:hover{color:var(--tx);border-color:var(--line);background:var(--card)}
.nv.on{color:var(--on-solid);background:var(--solid);border-color:var(--solid);box-shadow:var(--sa2)}
.nv .c{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.nv .c.hot{background:var(--yel);color:#17131f;border:var(--bw2) solid var(--line);padding:0 4px;font-weight:700}
.user{border-top:var(--bw) solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.user canvas{width:30px;height:30px;background:var(--card);border:var(--bw) solid var(--line)}
.user b{font-size:13px;font-weight:600}.user small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.user .st{margin-left:auto;width:8px;height:8px;background:var(--ok);animation:pu 2s infinite}
@keyframes pu{50%{opacity:.35}}
/* encabezado */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.th{height:64px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:var(--bw) solid var(--line);background:var(--bg)}
.th .av{width:36px;height:36px;background:var(--card);border:var(--bw) solid var(--line);box-shadow:var(--sh2)}
.th h1{font-family:var(--px);font-size:15px;font-weight:400;margin:0;letter-spacing:.05em}
.th .meta{display:flex;gap:8px;margin-top:5px;align-items:center;font-size:12px;color:var(--tx3)}
.pill{font-family:var(--mono);font-size:11px;color:var(--tx2)}
.pill + .pill:before{content:"·";margin-right:8px;color:var(--tx3)}
.pill.live{display:inline-flex;gap:6px;align-items:center;color:#17131f;background:var(--yel);border:var(--bw2) solid var(--line);padding:1px 6px;font-family:var(--px);font-size:9px}
.pill.live:before{content:"";width:5px;height:5px;background:#17131f;margin:0;animation:pu 1.2s infinite}
.ctx{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;color:var(--tx3);margin-left:4px}
.ctx .bar{display:flex;gap:2px}.ctx .bar i{width:5px;height:9px;border:1px solid var(--line)}.ctx .bar i.f{background:var(--tx)}
.th .acts{margin-left:auto;display:flex;gap:10px}
.ib{display:inline-flex;align-items:center;gap:7px;border:var(--bw) solid var(--line);background:var(--card);padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--tx);box-shadow:var(--sh1)}
.ib:hover{box-shadow:var(--sh2);transform:translate(-1px,-1px)}
.ib.p{background:var(--acc);color:var(--on-acc);font-family:var(--px);font-size:10px;box-shadow:var(--sh2)}
.ib:active{transform:translate(1px,1px);box-shadow:var(--sh0)}
/* conversación */
.feed{flex:1;overflow:auto;padding:26px 0 30px;min-height:0}
.col{max-width:780px;margin:0 auto;padding:0 28px}
.daysep{display:flex;align-items:center;gap:12px;margin:0 0 24px;font-family:var(--px);font-size:9px;letter-spacing:.14em;color:var(--tx2)}
.daysep:before,.daysep:after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--tx) 0 2px,transparent 2px 6px);opacity:.5}
.m{display:flex;gap:12px;margin-bottom:26px}
.m .av{width:30px;height:30px;background:var(--card);border:var(--bw) solid var(--line);flex:none}
.m .who{display:flex;gap:8px;align-items:baseline;margin-bottom:5px}
.m .who b{font-size:13px;font-weight:700}.m .who span{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.m .tx{font-size:15px;line-height:1.65;color:var(--tx)}
.m .tx p{margin:0 0 10px}.m .tx p:last-child{margin:0}
.m .tx ul{margin:6px 0 10px;padding-left:4px;list-style:none}.m .tx li{margin:4px 0;padding-left:16px;position:relative}
.m .tx li:before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;background:var(--bul)}
.m .tx b{font-weight:700;box-shadow:inset 0 -.38em 0 var(--mark)}
.m.me{flex-direction:row-reverse}
.m.me .bub{background:var(--card);border:var(--bw) solid var(--line);padding:9px 14px;max-width:520px;font-size:15px;line-height:1.55;box-shadow:var(--sh2)}
.m.me .who{justify-content:flex-end}
/* mini ventanas como las del sitio: barra de título en tinta */
.tools,.code,.perm{position:relative;margin:12px 0 2px;max-width:580px;background:var(--card);border:var(--bw) solid var(--line);box-shadow:var(--sh3)}
.tools summary,.code .hd,.perm .hd{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bar);color:var(--on-bar);font-family:var(--px);font-size:9px;letter-spacing:.08em;list-style:none;cursor:pointer}
.tools summary::-webkit-details-marker{display:none}
.tools summary:before,.code .hd:before{content:"";width:22px;height:6px;flex:none;background:linear-gradient(90deg,var(--acc) 0 6px,transparent 6px 8px,var(--yel) 8px 14px,transparent 14px 16px,var(--on-bar) 16px 22px)}
.tools summary b{font-weight:400}
.tools summary .ok{margin-left:auto;color:#8fe3b5}
.tools .ln{display:flex;gap:10px;padding:7px 12px;border-top:1.5px dashed var(--soft);font-family:var(--mono);font-size:12px;color:var(--tx2)}
.tools summary + .ln{border-top:0}
.tools .ln .k{width:44px;color:var(--tx);font-weight:700}
.tools .ln .r{margin-left:auto;color:var(--tx3)}
.code{background:var(--code)}
.code .hd{border-bottom:var(--bw2) solid var(--line)}
.code .hd span:last-child{margin-left:auto;color:var(--yel)}
.code pre{margin:0;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--code-tx)}
.code .add{color:#8fe3b5}.code .del{color:#ff9cc4}
.perm{box-shadow:var(--sa3)}
.perm:after{content:"¡PERMISO!";position:absolute;top:-12px;right:16px;background:var(--yel);color:#17131f;border:var(--bw) solid var(--line);font-family:var(--px);font-size:9px;padding:3px 7px;transform:rotate(3deg)}
.perm .hd{cursor:default}
.perm .bd{padding:12px 14px;font-size:14px}
.perm .cmd{font-family:var(--mono);font-size:12.5px;background:var(--bg);color:var(--tx);border:var(--bw2) solid var(--line);padding:7px 10px;margin:9px 0 12px}
.perm .cmd:before{content:"$ ";color:var(--acc);font-weight:700}
.perm .row{display:flex;gap:10px}
.typing{display:flex;align-items:center;gap:10px;margin:-8px 0 0 42px;font-family:var(--mono);font-size:11.5px;color:var(--tx3)}
.typing span{display:flex;gap:3px}
.typing i{width:6px;height:6px;background:var(--tx);animation:hop .9s infinite}
.typing i:nth-child(2){animation-delay:.12s}.typing i:nth-child(3){animation-delay:.24s;background:var(--acc)}
@keyframes hop{50%{transform:translateY(-4px)}}
.comp{padding:0 0 18px}
.comp .dith{margin-bottom:14px;opacity:.5}
.box{max-width:780px;margin:0 auto;padding:0 28px}
.inbox{border:var(--bw) solid var(--line);background:var(--card);box-shadow:var(--sh3);transition:box-shadow .12s}
.inbox:focus-within{box-shadow:var(--sa3)}
.inbox textarea{display:block;width:100%;border:0;resize:none;background:none;font:inherit;font-size:15px;color:var(--tx);padding:13px 15px 4px;min-height:50px;outline:0}
.inbox textarea::placeholder{color:var(--tx3)}
.inbox .bar{display:flex;align-items:center;gap:6px;padding:6px 8px 8px 10px}
.inbox .bar .chipb{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--tx2);padding:3px 8px;border:1.5px solid var(--soft)}
.inbox .bar .chipb:hover{border-color:var(--line);color:var(--tx)}
.inbox .send{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:var(--on-acc);border:var(--bw) solid var(--line);padding:7px 12px;font-family:var(--px);font-size:10px;box-shadow:var(--sh2)}
.inbox .send:active{transform:translate(2px,2px);box-shadow:var(--sh0)}
.hint{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--tx3);margin-top:9px}
/* carril derecho */
.rail{border-left:var(--bw) solid var(--line);background:var(--side);display:flex;flex-direction:column;min-height:0}
.rail .hd{height:64px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:var(--bw) solid var(--line)}
.rail .hd canvas{width:30px;height:30px;background:var(--card);border:var(--bw) solid var(--line)}
.rail .hd b{font-size:13.5px;font-weight:700}.rail .hd small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.rail .hd .sw{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--tx);border:var(--bw2) solid var(--line);background:var(--card);padding:3px 8px}
.rail .sc{flex:1;overflow:auto;padding:16px 14px;min-height:0}
.new{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:9px;background:var(--bar);color:var(--on-bar);border:var(--bw) solid var(--line);font-family:var(--px);font-size:10px;box-shadow:var(--sa2);margin-bottom:16px}
.new:active{transform:translate(2px,2px);box-shadow:var(--sa0)}
.srch{display:flex;align-items:center;gap:8px;border:var(--bw) solid var(--line);background:var(--card);padding:7px 10px;font-family:var(--mono);font-size:11.5px;color:var(--tx3);margin-bottom:8px}
.tab{position:relative;display:flex;gap:10px;align-items:flex-start;width:100%;padding:8px 10px;margin-bottom:3px;border:var(--bw) solid transparent}
.tab:hover{border-color:var(--line);background:var(--card)}
.tab.on{border-color:var(--line);background:var(--card);box-shadow:var(--sh2)}
.tab .s{width:8px;height:8px;margin-top:5px;border:var(--bw2) solid var(--line);flex:none}
.tab .s.w{background:var(--yel)}.tab .s.v{background:var(--ok)}
.tab b{display:block;font-size:13px;font-weight:600}
.tab span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--tx3);margin-top:2px}
.tab .nuevo{position:absolute;right:8px;top:7px;background:var(--acc);color:var(--on-acc);font-family:var(--px);font-size:8px;padding:2px 5px;transform:rotate(4deg);border:var(--bw2) solid var(--line)}
.sect{margin:20px 0 8px 2px;font-family:var(--px);font-size:9px;letter-spacing:.14em;color:var(--tx2);display:flex;justify-content:space-between;padding-right:4px}
.sect span{font-family:var(--mono);letter-spacing:0;color:var(--acc);font-weight:600}
.mem{border:var(--bw) solid var(--line);background:var(--card);padding:4px 12px;box-shadow:var(--sh2)}
.mem .it{display:flex;gap:8px;font-size:12.5px;line-height:1.45;padding:8px 0;border-bottom:1.5px dashed var(--soft)}
.mem .it:last-child{border:0}
.tg{font-family:var(--px);font-size:8px;padding:2px 5px;height:fit-content;flex:none;color:#17131f;border:var(--bw2) solid var(--line)}
.tg.d{background:var(--t-dec)}.tg.p{background:var(--t-pen)}.tg.h{background:var(--t-hec)}

/* ---- bordes ---- */
body[data-bd=fino]{--bw:1px;--bw2:1px;--sh0:none;--sh1:none;--sh2:none;--sh3:none;--sa0:none;--sa2:none;--sa3:none}
body[data-bd=suave]{--bw:1px;--bw2:1px;--rad:10px;--rad2:7px;--sh0:none;--sh1:0 1px 2px rgba(0,0,0,.07);--sh2:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.06);--sh3:0 2px 4px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);--sa0:none;--sa2:var(--sh2);--sa3:var(--sh3)}
body[data-bd=suave] .side,body[data-bd=suave] .rail,body[data-bd=suave] .th,body[data-bd=suave] .brand,body[data-bd=suave] .user,body[data-bd=suave] .rail .hd{border-color:var(--soft)}
.tools,.code,.perm,.inbox,.mem,.m.me .bub,.new,.srch{border-radius:var(--rad);overflow:hidden}
.perm{overflow:visible}.perm .hd{border-radius:calc(var(--rad) - 1px) calc(var(--rad) - 1px) 0 0}
.ib,.nv,.tab,.send,.chipb,.sw,.th .av,.m .av,.user canvas,.rail .hd canvas,.nv .c.hot,.pill.live,.tg{border-radius:var(--rad2)}
/* ---- títulos ---- */
.th h1,.gl,.sect,.daysep,.pill.live,.tools summary,.code .hd,.perm .hd,.ib.p,.send,.new,.tg,.tab .nuevo,.perm:after,.nv .c.hot{font-family:var(--pxt)}
body[data-tt=normal]{--pxt:var(--sans)}
body[data-tt=normal] .th h1{font-size:17px;font-weight:700;letter-spacing:0}
body[data-tt=normal] .gl,body[data-tt=normal] .sect,body[data-tt=normal] .daysep{font-size:10.5px;font-weight:700;letter-spacing:.1em}
body[data-tt=normal] .tools summary,body[data-tt=normal] .code .hd,body[data-tt=normal] .perm .hd{font-size:11px;font-weight:600;letter-spacing:.04em}
body[data-tt=normal] .ib.p,body[data-tt=normal] .send,body[data-tt=normal] .new{font-size:12.5px;font-weight:700;letter-spacing:.02em}
body[data-tt=normal] .tg,body[data-tt=normal] .tab .nuevo,body[data-tt=normal] .perm:after,body[data-tt=normal] .pill.live{font-size:9.5px;font-weight:700;letter-spacing:.04em}
/* ---- avatares ---- */
.ini{display:none;flex:none;align-items:center;justify-content:center;font-weight:700;color:#17131f;border:var(--bw) solid var(--line);border-radius:var(--rad2)}
body[data-av=ini] canvas.av,body[data-av=ini] #meav,body[data-av=ini] #rlav{display:none}
body[data-av=ini] .ini{display:flex}
body[data-av=none] canvas.av,body[data-av=none] #meav,body[data-av=none] #rlav,body[data-av=none] .ini{display:none}
body[data-av=none] .typing{margin-left:0}
/* ---- íconos ---- */
.lni{display:none;width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:square}
body[data-ic=linea] canvas.pxi{display:none}body[data-ic=linea] .lni{display:block}
body[data-ic=none] .navs canvas.pxi{display:none}
body[data-ic=none] .perm canvas.pxi{display:none}
/* ---- fondo ---- */
body[data-bg=liso]:before,body[data-bg=liso] #sky,body[data-bg=grano] #sky,body[data-bg=puntos] #sky,body[data-bg=puntos]:before{display:none}
body[data-bg=puntos] .app{background-image:radial-gradient(rgba(var(--dust),.16) 1px,transparent 1.2px);background-size:16px 16px}
/* ---- letreros y trama ---- */
body[data-lt=no] .perm:after,body[data-lt=no] .tab .nuevo{display:none}
body[data-tr=no] .dith{visibility:hidden;height:0;margin:0!important}
body[data-tr=no] .daysep:before,body[data-tr=no] .daysep:after{background:var(--soft);height:1px;opacity:1}

body{--P:#f2efe8;--K:#1b2340;--X:#e2583e;--XO:#fff;--bg:var(--P);--tx:var(--K);--acc:var(--X);--on-acc:var(--XO);
 --side:color-mix(in srgb,var(--P) 91%,var(--K));--card:color-mix(in srgb,var(--P) 35%,#fff);--line:var(--K);--shadow:var(--K);
 --solid:var(--K);--on-solid:var(--P);--bar:var(--K);--on-bar:var(--P);--yel:#f6c945;--soft:color-mix(in srgb,var(--P) 78%,var(--K));
 --tx2:color-mix(in srgb,var(--K) 76%,var(--P));--tx3:color-mix(in srgb,var(--K) 55%,var(--P));--code:var(--K);
 --mark:color-mix(in srgb,var(--X) 26%,transparent);--bul:var(--X);--ink-ic:var(--K)}
body[data-dark="1"]{--side:color-mix(in srgb,var(--P) 82%,#000);--card:color-mix(in srgb,var(--P) 92%,var(--K));--soft:color-mix(in srgb,var(--P) 80%,var(--K));
 --line:color-mix(in srgb,var(--K) 80%,var(--P));--shadow:color-mix(in srgb,var(--X) 45%,var(--P));--code:color-mix(in srgb,var(--P) 55%,#000);
 --bar:color-mix(in srgb,var(--P) 45%,#000);--on-bar:color-mix(in srgb,var(--K) 85%,var(--P));--mark:color-mix(in srgb,var(--X) 38%,transparent)}
body[data-dark="1"]:before{mix-blend-mode:screen;opacity:.1}

.wm{display:none;image-rendering:pixelated}
.bname{display:none}
.topband{display:none}
/* 1 · letras del sitio */
body[data-mk="1"] .brand,body[data-mk="2"] .brand,body[data-mk="4"] .brand{padding:0 12px;justify-content:center}
body[data-mk="1"] #logo,body[data-mk="2"] #logo,body[data-mk="4"] #logo,body[data-mk="5"] #logo,body[data-mk="6"] #logo{display:none}
body[data-mk="1"] .brand b,body[data-mk="2"] .brand b,body[data-mk="4"] .brand b,body[data-mk="5"] .brand b{display:none}
body[data-mk="1"] #wmS,body[data-mk="2"] #wmS{display:block}
/* 2 · en bloque */
body[data-mk="2"] .brand{background:var(--bar)}
/* 3 · banda superior */
body[data-mk="3"] .app{grid-template-rows:72px minmax(0,1fr)}
body[data-mk="3"] .side,body[data-mk="3"] .main,body[data-mk="3"] .rail{grid-row:2}
body[data-mk="3"] .lab{grid-row:1/-1}
body[data-mk="3"] .side .brand{display:none}
body[data-mk="3"] .topband{display:flex;position:relative;z-index:4;grid-column:1/4;grid-row:1;align-items:center;gap:18px;padding:0 22px;background:var(--band);border-bottom:var(--bw) solid var(--line)}
.topband .tb-r{margin-left:auto;display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11.5px;color:color-mix(in srgb,var(--band-tx) 72%,transparent)}
.topband .tb-r b{font-family:var(--px);font-weight:400;font-size:11px;letter-spacing:.06em;color:var(--band-tx)}

.pill,.th .meta,.li .t span,.li .eng,.li .when,.stat small,.sku,.pl-m,.sb small,.m .who span,.room-li .t span,.ag-ev span,.ev span,.vv,.tab span,.tab b,.rail .hd small,.agc .eng2,.ag-next span,.ag-h span,.mr-h span,.rm small,.agmenu small,.fc em,.mch,.kbar kbd,.srch,.chipb,.in,.sel,.hr,.ag-hrs span,.daysep,.sect,.gl,.grp-h,.rv-k,.pl-h small,.ag-next small,.who2,.dh{font-family:var(--sans)!important}

/* estados con un solo significado: verde = trabajando · ámbar = te espera · hueco = cerrada */

.led.w{background:var(--ok2)!important;border-color:var(--ok2)!important}

.cv-f{flex:1;overflow:auto;padding:18px 26px 10px}

/* escala global con transform: Safari y Chrome dan las mismas medidas (offsetTop, offsetLeft) dentro de .app */

/* pestaña en vivo: su terminal */
.feed.vivo{background:color-mix(in srgb,var(--K) 4%,transparent)}
.feed.vivo .col{max-width:980px}
.term{margin:6px 0 0;padding:16px 18px;min-height:240px;background:#0f1a1e;color:#e3ece9;border-radius:12px;font:12.5px/1.5 'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:inset 0 0 0 1px #ffffff10,0 1px 2px rgba(0,0,0,.06)}
.term .skel i{background:repeating-conic-gradient(#ffffff14 0 25%,transparent 0 50%) 0 0/4px 4px}
.pill.live.esp{background:color-mix(in srgb,var(--wait) 16%,transparent);color:#9a6a0c}
.cmp-q{display:flex;align-items:center;gap:12px;justify-content:space-between;margin:0 0 8px;padding:9px 12px;border-radius:10px;background:color-mix(in srgb,var(--wait) 14%,var(--card));font-size:var(--f3)}
.chipb span{display:inline-flex;align-items:center;gap:5px}
.th .acts .fcs .fc{gap:6px}

/* fondo animado */
#fondo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;image-rendering:pixelated}
.app{position:relative;z-index:1}
.side,.rail{background:color-mix(in srgb,var(--side) 92%,transparent)!important}
/* ===== Pestañas: explorador ===== */
.pg.tx2{display:grid;grid-template-columns:220px minmax(0,1fr);gap:26px;align-items:start}
.tx-l{position:sticky;top:0;display:flex;flex-direction:column;gap:2px}
.tx-l .gl{margin:6px 6px 6px!important}.tx-l .gl:not(:first-child){margin-top:18px!important}
.tx-ag,.tx-st{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:9px;font-size:var(--f3);color:var(--tx2);transition:background-color .2s,color .2s}
.tx-ag:hover,.tx-st:hover{background:color-mix(in srgb,var(--card) 80%,transparent);color:var(--tx)}
.tx-ag.on,.tx-st.on{background:var(--card);color:var(--tx);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.05)}
.tx-ag .ag{width:20px!important;height:20px!important;font-size:9px!important}
.tx-all{--c:var(--K);color:var(--card)!important;display:inline-grid!important;place-items:center}
.tx-an{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-ag em,.tx-st em{font-style:normal;font-size:var(--f1);color:var(--tx3);font-variant-numeric:tabular-nums}
.tx-st span{flex:1;text-align:left}
.tx-v{display:inline-flex;align-items:center;gap:4px;font-size:var(--f1);font-weight:700;color:var(--ok2)}
.tx-v i,.tp-live i{width:6px;height:6px;border-radius:50%;background:var(--ok2);animation:pu 1.6s ease-in-out infinite}
.tx-r{min-width:0}
.tx-sec{margin-bottom:28px}
.tx-sh{display:flex;align-items:baseline;gap:8px;margin:0 2px 12px}
.tx-sh b{font-size:var(--f5)}.tx-sh em{font-style:normal;font-size:var(--f2);color:var(--tx3)}
.tx-sh small{margin-left:auto;font-size:var(--f2);color:var(--tx3)}
.tx-sh .tp-live{align-self:center}
.tx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tp{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 16px 12px;background:var(--card);border:1px solid color-mix(in srgb,var(--tx) 11%,transparent);border-radius:14px;overflow:hidden;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s cubic-bezier(.22,1,.36,1),border-color .2s}
.tp:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);opacity:.0;transition:opacity .2s}
.tp:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.04),0 14px 30px rgba(0,0,0,.09);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.tp:hover:before{opacity:1}
.tp.viva{border-color:color-mix(in srgb,var(--ok2) 35%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--ok2) 6%,var(--card)),var(--card) 60%)}
.tp.arch{opacity:.72}
.tp-h{display:flex;align-items:center;gap:7px}.tp-h .ag{width:18px!important;height:18px!important;font-size:8px!important}
.tp-ag{font-size:var(--f2);font-weight:600;color:var(--tx2)}.tp-t{margin-left:auto;font-size:var(--f1);color:var(--tx3)}
.tp-n{font-size:var(--f4);font-weight:700;line-height:1.3}
.tp.big .tp-n{font-size:var(--f5)}
.tp-p{margin:0;font-size:var(--f2);line-height:1.45;color:var(--tx3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.tp.big .tp-p{-webkit-line-clamp:3;min-height:4.35em;color:var(--tx2)}
.tp-f{display:flex;align-items:center;gap:8px;margin-top:4px}
.tp-live{display:inline-flex;align-items:center;gap:6px;font-size:var(--f1);font-weight:700;color:var(--ok2)}
.tp-m{font-size:var(--f1);color:var(--tx3);padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--tx) 6%,transparent)}
.tp-go{margin-left:auto;color:var(--tx3);opacity:0;transform:translateX(-4px);transition:opacity .2s,transform .25s cubic-bezier(.22,1,.36,1)}
.tp:hover .tp-go{opacity:1;transform:none;color:var(--acc)}
.tx-mes{border-top:1px solid color-mix(in srgb,var(--tx) 9%,transparent)}
.tx-mh{display:flex;align-items:center;gap:8px;width:100%;padding:10px 4px;font-size:var(--f3);font-weight:650;color:var(--tx2)}
.tx-mh .ic{transform:rotate(-90deg);transition:transform .25s cubic-bezier(.22,1,.36,1)}.tx-mes.on .tx-mh .ic{transform:none}
.tx-mh em{font-style:normal;font-weight:500;color:var(--tx3);font-size:var(--f2)}
.tx-mini{display:flex;flex-direction:column;padding:0 0 10px}
.tx-row{display:grid;grid-template-columns:22px minmax(120px,240px) minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 10px;border-radius:9px;text-align:left;transition:background-color .2s}
.tx-row:hover{background:var(--card)}
.tx-row .ag{width:20px!important;height:20px!important;font-size:9px!important}
.tx-row b{font-size:var(--f3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-rp{font-size:var(--f2);color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-row small{font-size:var(--f1);color:var(--tx3);white-space:nowrap}

/* ===== Pestañas: lista normal ===== */
.wrap.tl{max-width:1100px}
.tl-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 12px;border-bottom:1px solid color-mix(in srgb,var(--tx) 10%,transparent)}
.tl-tabs{display:flex;gap:4px}
.tl-tab{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 10px 10px;font-size:var(--f3);font-weight:600;color:var(--tx3);transition:color .2s}
.tl-tab em{font-style:normal;font-weight:500;font-size:var(--f1);color:var(--tx3);font-variant-numeric:tabular-nums}
.tl-tab:hover{color:var(--tx)}
.tl-tab.on{color:var(--tx)}
.tl-tab.on:after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--acc)}
.tl-ag{display:inline-flex;align-items:center;gap:8px;padding-bottom:8px;font-size:var(--f2);color:var(--tx3)}
.tl-sel{font:inherit;font-size:var(--f3);color:var(--tx);background:var(--card);border:1px solid color-mix(in srgb,var(--tx) 14%,transparent);border-radius:8px;padding:5px 26px 5px 10px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer}
.tl-box{background:var(--card);border:1px solid color-mix(in srgb,var(--tx) 10%,transparent);border-radius:12px;overflow:hidden}
.tl-row{display:grid;grid-template-columns:14px minmax(0,1fr) 150px 110px 84px;align-items:center;gap:14px;width:100%;padding:10px 18px;text-align:left;border-top:1px solid color-mix(in srgb,var(--tx) 7%,transparent);transition:background-color .15s}
.tl-row:hover{background:color-mix(in srgb,var(--acc) 5%,var(--card))}
.tl-head{border-top:0;padding-top:9px;padding-bottom:9px;font-size:var(--f1);font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);background:color-mix(in srgb,var(--tx) 3%,var(--card))}
.tl-head:hover{background:color-mix(in srgb,var(--tx) 3%,var(--card))}
.tl-head .r,.tl-w{text-align:right}
.tl-g{padding:14px 18px 6px;font-size:var(--f2);font-weight:650;color:var(--tx2);border-top:1px solid color-mix(in srgb,var(--tx) 7%,transparent)}
.tl-head + .tl-g{border-top:0}
.tl-dot{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--tx) 22%,transparent);justify-self:center}
.tl-dot.viva{background:var(--ok2);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok2) 18%,transparent)}
.tl-dot.arch{background:transparent;border:1.5px solid color-mix(in srgb,var(--tx) 25%,transparent)}
.tl-n{display:flex;flex-direction:column;min-width:0}
.tl-n b{font-size:var(--f4);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-n small{font-size:var(--f2);color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tl-a{display:inline-flex;align-items:center;gap:7px;font-size:var(--f3);color:var(--tx2);min-width:0;white-space:nowrap}
.tl-a .ag{width:18px!important;height:18px!important;font-size:8px!important}
.tl-m{font-size:var(--f3);color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-w{font-size:var(--f2);color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums}
.tl-row.arch .tl-n b{color:var(--tx2);font-weight:500}

.tl-row:not(.tl-head){min-height:52px}

/* el agente se marca con un punto de su color (sin iniciales) */
.agd{display:inline-block;flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,transparent)}
.agd.big{width:14px;height:14px;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.cv-pila .agd{margin-right:3px;box-shadow:0 0 0 2px var(--side)}
.cv-m>.agd{margin-bottom:12px}

/* ===== Pestañas por agente, plegable ===== */
.tg-list{display:flex;flex-direction:column;gap:10px}
.tg-b{background:var(--card);border:1px solid color-mix(in srgb,var(--tx) 10%,transparent);border-radius:12px;overflow:hidden;transition:box-shadow .25s}
.tg-b.on{box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 22px rgba(0,0,0,.05)}
.tg-h{display:flex;align-items:center;gap:10px;width:100%;padding:13px 18px;text-align:left;transition:background-color .15s}
.tg-h:hover{background:color-mix(in srgb,var(--tx) 3%,var(--card))}
.tg-h .ic{color:var(--tx3);transform:rotate(-90deg);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.tg-b.on .tg-h .ic{transform:none}
.tg-h b{font-size:var(--f5);font-weight:700}
.tg-c{font-size:var(--f3);color:var(--tx3);margin-left:4px}
.tg-v{font-size:var(--f3);color:var(--ok2);font-weight:600}
.tg-u{margin-left:auto;font-size:var(--f2);color:var(--tx3)}
.tg-rows{border-top:1px solid color-mix(in srgb,var(--tx) 8%,transparent);padding:4px 0}
.tg-r{display:grid;grid-template-columns:10px minmax(140px,260px) minmax(0,1fr) 70px 12px;align-items:center;gap:14px;width:100%;padding:9px 18px 9px 42px;text-align:left;transition:background-color .15s}
.tg-r:hover{background:color-mix(in srgb,var(--c) 9%,var(--card))}
.tg-r b{font-size:var(--f4);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-p{font-size:var(--f3);color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-w{font-size:var(--f2);color:var(--tx3);text-align:right;white-space:nowrap}
.tg-r .ic{color:var(--tx3);opacity:0;transform:translateX(-3px);transition:opacity .2s,transform .25s cubic-bezier(.22,1,.36,1)}
.tg-r:hover .ic{opacity:1;transform:none}
.tg-r.arch b{font-weight:500;color:var(--tx2)}
.tl-dot.off{background:transparent;box-shadow:none}
.tg-mas{display:block;margin:2px 0 6px 42px;padding:6px 10px;border-radius:8px;font-size:var(--f3);font-weight:600;color:var(--acc)}
.tg-mas:hover{background:color-mix(in srgb,var(--acc) 8%,transparent)}

/* la terminal misma */
.feed.vivo{padding:14px 0 10px!important}
.feed.vivo .col{max-width:none;padding:0 18px}
.term-box{position:relative;border-radius:12px;background:#0f1a1e;box-shadow:inset 0 0 0 1px #ffffff12,0 1px 2px rgba(0,0,0,.06);transition:box-shadow .2s}
.term-box.foco{box-shadow:inset 0 0 0 1px #ffffff12,0 0 0 2px color-mix(in srgb,var(--acc) 70%,transparent)}
.term2{min-height:300px;padding:14px 16px;color:#e3ece9;font:12.5px/1.45 'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace;white-space:pre;overflow-x:auto;outline:0;cursor:text}
.term2 .skel i{background:repeating-conic-gradient(#ffffff14 0 25%,transparent 0 50%) 0 0/4px 4px}
.term-hint{position:absolute;right:12px;bottom:10px;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:#ffffff14;color:#e3ece9;font-size:var(--f2);cursor:pointer;transition:opacity .2s}

.term-keys{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 18px 12px;font-size:var(--f2);color:var(--tx3)}
.term-keys>span{margin-right:4px}
.term-keys .ib.sm{font-family:var(--mono)!important;font-size:var(--f1)!important;padding:3px 8px}
.ab-box{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 18px;padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid color-mix(in srgb,var(--tx) 10%,transparent)}
.ab-box b{display:block;font-size:var(--f4)}.ab-estado{display:inline-flex;align-items:center;gap:6px;font-size:var(--f2);color:var(--tx3)}

.tl-dot.otra{background:transparent;box-shadow:inset 0 0 0 2px var(--ok2)}

/* cambiar de motor */
.mm-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px 6px 11px;border-radius:999px;background:color-mix(in srgb,var(--acc) 12%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);color:var(--tx);font-size:var(--f3);font-weight:650;transition:background-color .2s,transform .2s cubic-bezier(.22,1,.36,1)}
