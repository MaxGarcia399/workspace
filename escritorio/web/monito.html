<!doctype html>
<html lang="es" class="wsm-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspace Compañero</title>
<!-- WORKSPACE · monito de escritorio. Generado por escritorio/web/build.py; no editar a mano. -->
<style>
:root{--bg:#141416;--rail:#0d0d0f;--panel:#19191c;--card:#202024;--card2:#26262b;--line:#2b2b31;
  --tx:#ededf0;--tx2:#a4a4ad;--tx3:#6f6f78;--ok:#3fbf7f;--warn:#e7a43a;--bad:#ec5a49;
  --sans:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--ease:cubic-bezier(.22,1,.36,1);
  --ac:#ffffff;--acx:#151518;
  
  --suave:var(--ease);--sale:cubic-bezier(.4,0,.2,1);--rebote:cubic-bezier(.34,1.56,.64,1);
  --lit-card:#26262b;--lit-tile:#2d2d33;--lit-row:#232327;--lit-row-open:#212125;--lit-tx:#f2f2f5;
  --chip-line:#36363e;--chip-hover:#2a2a30;--bubble-me:#33333a;--borde:#2a2a30}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
@keyframes ent{from{opacity:0}}
@keyframes sube{from{transform:translateY(10px) scale(.98);opacity:0}}
@keyframes lat{50%{opacity:.25}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes brillo{to{background-position:-200% 0}}
@keyframes punto{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
@keyframes corre{0%{left:-45%}100%{left:100%}}
@keyframes vaiven{from{left:0}to{left:70%}}
@keyframes tiembla{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes subeH{from{transform:translateY(100%)}}
.mono{display:inline-block;line-height:0}
.mono svg{display:block;overflow:visible}
.ray7{position:relative;display:flex;align-items:center;justify-content:center;gap:3px;width:26px;height:5px;margin-top:6px;border-radius:999px;flex:none}
.ray7.r-libre::after{content:"";width:4px;height:4px;border-radius:50%;background:#3a3a42}
.ray7.r-dormido::after{content:"";width:10px;height:3px;border-radius:999px;background:#34343b;animation:lat 3s ease-in-out infinite}
.ray7.r-escribiendo,.ray7.r-leyendo,.ray7.r-enviando,.ray7.r-recibido,.ray7.r-cambiando{background:color-mix(in srgb,var(--c) 20%,#202024);overflow:hidden}
.ray7.r-escribiendo::after{content:"";position:absolute;top:0;bottom:0;width:45%;border-radius:999px;background:var(--c);animation:corre 1.2s ease-in-out infinite}
.ray7.r-leyendo::after,.ray7.r-enviando::after,.ray7.r-recibido::after,.ray7.r-cambiando::after{content:"";position:absolute;top:0;bottom:0;width:30%;border-radius:999px;background:var(--c);animation:vaiven .9s ease-in-out infinite alternate}
.ray7.r-pensando b{width:5px;height:5px;border-radius:50%;background:var(--c);animation:punto 1.2s ease-in-out infinite}
.ray7.r-pensando b:nth-child(2){animation-delay:.16s}
.ray7.r-pensando b:nth-child(3){animation-delay:.32s}
.ray7.r-skill{gap:2px;width:30px}
.ray7.r-skill b{flex:1;height:4px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,#202024)}
.ray7.r-skill b.h{background:var(--c)}
.ray7.r-skill b.a{background:var(--c);animation:lat 1s ease-in-out infinite}
.ray7.r-espera{background:var(--warn);animation:lat 1.2s ease-in-out infinite}
.ray7.r-listo{width:12px;background:var(--ok);animation:pop .45s var(--ease)}
.ray7.r-error,.ray7.r-cerrado,.ray7.r-no_salio{width:16px;background:var(--bad);animation:tiembla .5s ease-in-out infinite}
.estado span{background:linear-gradient(90deg,var(--tx2) 0%,#fff 50%,var(--tx2) 100%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brillo 1.6s linear infinite}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;border:1.5px solid #36363e;font-weight:650;font-size:13.5px;color:var(--tx);transition:background-color .15s,transform .2s var(--ease),filter .15s}
.chip:hover{background:#26262c;transform:translateY(-1px)}
.chip.p{background:var(--ac);color:var(--acx);border-color:transparent}
.chip.p:hover{background:var(--ac);filter:brightness(1.08)}
.chip:disabled{opacity:.4;cursor:not-allowed;transform:none}
@keyframes onda{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1.2)}}
.wsm-yo .mono,.wsm-ag.on .mono{filter:drop-shadow(0 7px 9px color-mix(in srgb,var(--c) 42%,transparent))}
/* ===== monito de escritorio (escritorio/web/src) =====
   El monito, su rayita y su brillo son los de la página (arriba, tal cual). Aquí va lo del escritorio: su nido en la
   esquina, la burbuja, la barra de ⌥ Espacio, las tarjetas de pregunta y de permiso, y el anillo de «señalar».
   Mismas reglas de la página: el color lo pone el personaje; la interfaz va en grises.
   Movimiento: entrar y salir es de la clase de cada pieza (transform y opacidad); recorrerse y cambiar de alto, de
   `acomodar` (translate y height, en 20_escritorio.js). Con «reducir movimiento», nada se anima. */
html.wsm-app,html.wsm-app body{height:100%;margin:0;background:transparent;overflow:hidden}
html.wsm-app body{-webkit-user-select:none;user-select:none}
.wsm,.wsm *{box-sizing:border-box;margin:0;padding:0}
.wsm button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wsm textarea{font:inherit;color:inherit;background:none;border:0;outline:0;resize:none}
.wsm{--c:#ffffff;position:absolute;right:14px;bottom:14px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:12px;
  max-width:calc(100% - 28px);max-height:calc(100% - 28px);font:14.5px/1.5 var(--sans);color:var(--tx);-webkit-font-smoothing:antialiased;pointer-events:none}
.wsm>*{pointer-events:auto;flex:none}
.wsm>.wsm-globo{flex:0 1 auto;min-height:0}
.wsm [hidden]{display:none!important}
/* un solo par de animaciones para los dos lados (--dy: hacia dónde): cambiar de lado no las vuelve a empezar */
@keyframes wsm-pop{from{opacity:0;transform:translateY(calc(12px * var(--dy,1))) scale(.9)}}
@keyframes wsm-sale{to{opacity:0;transform:translateY(calc(8px * var(--dy,1))) scale(.95)}}
@keyframes wsm-entra{from{opacity:0;transform:translateY(5px)}}
@keyframes wsm-pulso{0%,100%{box-shadow:0 0 0 2px var(--c),0 0 0 6px color-mix(in srgb,var(--c) 22%,transparent),0 0 26px color-mix(in srgb,var(--c) 40%,transparent)}
  50%{box-shadow:0 0 0 2px var(--c),0 0 0 11px color-mix(in srgb,var(--c) 10%,transparent),0 0 34px color-mix(in srgb,var(--c) 55%,transparent)}}
@keyframes wsm-tecla{0%,100%{transform:translateY(0)}40%{transform:translateY(2px);box-shadow:0 0 0 #000}}

/* ---------- el nido: un pedacito del riel de la página, en la esquina ---------- */
.wsm-nido{position:relative;width:100px;height:118px;border-radius:28px;background:linear-gradient(180deg,#141417,var(--rail) 60%);
  border:1px solid rgba(255,255,255,.075);
  /* UX (22-nov): filo de medio punto, sombra corta y pareja que CABE en el margen del panel (14 pt): la de antes (44 pt)
     se cortaba en línea recta donde acaba la ventana del monito y se veía sucia sobre fondos claros */
  box-shadow:0 0 0 .5px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.32),0 5px 12px -3px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.07);
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;padding-bottom:12px;cursor:grab;touch-action:none;
  transition:transform .35s var(--rebote),box-shadow .2s}
.wsm-nido:hover{transform:translateY(-2px)}
/* agarrarlo (la app lo arrastra, nativo): se levanta, un poco más grande y con más sombra (que cabe en los 14 pt de
   margen del panel: crece hacia arriba), y lo que tiene abierto se va con él; al soltarlo baja con su rebote */
.wsm.agarrado .wsm-nido{cursor:grabbing;transform:translateY(-4px) scale(1.06);transform-origin:50% 85%;
  transition:transform .2s var(--rebote),box-shadow .18s;
  box-shadow:0 0 0 .5px rgba(0,0,0,.6),0 3px 5px rgba(0,0,0,.28),0 7px 12px -5px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09)}
.wsm.agarrado .wsm-pista{opacity:0!important}
/* la mudanza de lado: el nido se esconde (la app lo tapa con su foto) y lo que tiene abierto se va y vuelve del lado nuevo */
.wsm.mudando .wsm-nido{visibility:hidden}
.wsm.mudando>.wsm-globo,.wsm.mudando>.wsm-barra,.wsm.mudando>.wsmm{filter:opacity(0);pointer-events:none}
/* el arrastre de antes (una app que no lo hace nativo): el nido se levanta un poco y lo demás se aparta */
.wsm.arrastrando .wsm-nido{cursor:grabbing;transform:translateY(-3px);box-shadow:0 0 0 .5px rgba(0,0,0,.6),0 2px 3px rgba(0,0,0,.3),0 6px 12px -4px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.08)}
.wsm.arrastrando .wsm-pista{opacity:0!important}
/* (con filter: la opacidad es de sus animaciones de entrar y salir; así no se pelean) */
.wsm>.wsm-globo,.wsm>.wsm-barra,.wsm>.wsmm{transition:filter .14s}
.wsm.arrastrando>.wsm-globo,.wsm.arrastrando>.wsm-barra,.wsm.arrastrando>.wsmm{filter:opacity(0);pointer-events:none}
.wsm-yo{position:relative;z-index:3;line-height:0;will-change:transform}
.wsm-nido .ray7{margin-top:8px;height:6px}            /* par: su puntito de 4 cae en píxel entero (nítido en 1× y 2×) */
/* su brillo de elegido, corto y solo con color (un fantasma blanco dejaba un halo lechoso): --brillo lo pone ponerMonito */
.wsm-yo .mono{filter:drop-shadow(0 3px 4px var(--brillo,transparent))}
.wsm-nido.vacio::before{content:"";position:absolute;left:24px;right:24px;top:30px;bottom:30px;border-radius:50%;border:1.5px dashed #2c2c33}
.wsm-pista{position:absolute;right:calc(100% + 10px);bottom:14px;white-space:nowrap;padding:6px 10px;border-radius:10px;background:#26262c;
  border:1px solid #33333a;font-size:12.5px;font-weight:600;color:var(--tx);opacity:0;transform:translateX(6px);pointer-events:none;
  transition:opacity .18s,transform .25s var(--ease)}
.wsm-pista small{font-weight:500;color:var(--tx3);margin-left:6px}
.wsm-nido:hover .wsm-pista{opacity:1;transform:none}

/* ---------- la burbuja ---------- */
.wsm-globo{position:relative;width:min(356px,calc(100vw - 28px));max-height:min(64vh,540px);display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--line);border-radius:20px;border-bottom-right-radius:8px;
  box-shadow:0 0 0 .5px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.26),0 8px 18px -12px rgba(0,0,0,.55);padding:12px 15px 12px;transform-origin:100% 100%;animation:wsm-pop .42s var(--rebote) both}
.wsm-globo.sale{animation:wsm-sale .2s var(--sale) forwards;pointer-events:none}
.wsm .midiendo{overflow:hidden}
.wsm .saliendo{pointer-events:none;margin:0!important;z-index:1}
.wsm-fantasma{position:absolute;margin:0!important;pointer-events:none;z-index:2}
.wsm .entra{animation:wsm-entra .26s var(--ease) both}
.wsm-ext.entra>*{animation:wsm-entra .26s var(--ease) both}.wsm-ext.entra>*:nth-child(2){animation-delay:.05s}.wsm-ext.entra>*:nth-child(3){animation-delay:.1s}
.wsm-ext.entra{animation:none}
.wsm-globo.mal{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.wsm-cab{display:flex;align-items:center;gap:8px;min-height:24px;padding-right:26px;font-size:12.5px;color:var(--tx3)}
.wsm-cab b{color:var(--tx);font-weight:650;font-size:13.5px}
.wsm-cab .pt{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.wsm-cab .estado{font-style:normal}
.wsm-x{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--tx3)}
.wsm-x:hover{background:#2a2a30;color:var(--tx)}
/* lo tuyo de ahora: el mismo globo lavanda que en la plática (11_conversacion.css), entero (antes se cortaba en un renglón) */
.wsm-tu{margin:2px 0;align-self:flex-end;max-width:88%}
.wsm-txt{min-height:0;word-wrap:break-word;font-size:14.5px;line-height:1.55}
.wsm-txt:empty{display:none}
/* el ▮ de «escribiendo», al final de lo último que lleva escrito */
.wsm-txt.vivo>:last-child::after{content:"";display:inline-block;width:7px;height:14px;margin-left:3px;border-radius:2px;background:var(--c);vertical-align:-2px;animation:lat 1s steps(2) infinite}
.wsm-pasos{margin-top:10px}
.wsm-pasos .barras{display:flex;gap:4px}
.wsm-pasos .barras b{flex:1;height:5px;border-radius:999px;background:color-mix(in srgb,var(--c) 20%,#2a2a30);transition:background-color .3s}
.wsm-pasos .barras b.h{background:var(--c)}.wsm-pasos .barras b.a{background:var(--c);animation:lat 1s ease-in-out infinite}
.wsm-pasos small{display:block;margin-top:6px;font-size:12.5px;color:var(--tx2)}
.wsm-uso{margin-top:10px;padding-top:8px;border-top:1px solid #2a2a30;font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.wsm-uso:empty{display:none}

/* ---------- lo que el texto escondía: «aprendió» y las tarjetas de archivo (las de la página, en chico) ---------- */
.wsm-ext{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.wsm-aprendio{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 10px 3px 7px;border-radius:999px;
  background:color-mix(in srgb,var(--c) 14%,#202024);border:1px solid color-mix(in srgb,var(--c) 30%,#2c2c33);font-size:12px;font-weight:600;
  color:color-mix(in srgb,var(--c) 70%,#fff)}
.wsm-aprendio svg{width:14px;height:14px;flex:none}
.wsm-aprendio small{font-weight:500;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm-arch{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px 10px;padding:9px 10px 9px 11px;border-radius:14px;
  background:#1d1d21;border:1px solid #2c2c33}
.wsm-arch>svg{width:18px;height:18px;color:var(--tx3)}
.wsm-arch .tx{min-width:0}
.wsm-arch b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm-arch small{display:block;color:var(--tx3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm-arch .chips{grid-column:1 / -1;display:flex;gap:6px}
.wsm-arch .chip{padding:5px 12px;font-size:12.5px}

/* ---------- «Seguir en la página» ---------- */
.wsm-sigue{display:flex;justify-content:flex-end;margin-top:9px}
.wsm .wsm-ir{display:inline-flex;align-items:center;gap:5px;padding:4px 6px 4px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--tx3);
  transition:background-color .15s,color .15s}
.wsm .wsm-ir:hover{background:#26262c;color:var(--tx)}
.wsm .wsm-ir:disabled{opacity:.5;cursor:default}
.wsm-ir svg{width:11px;height:11px}

/* ---------- la barra: lo que tienes enfrente (D3-a) y lo que soltaste, con su ✕ ---------- */
.wsm-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px 8px}
.wsm-chip{display:inline-flex;align-items:center;gap:6px;height:28px;max-width:100%;padding:0 4px 0 10px;border-radius:999px;background:#202024;
  border:1px solid #2c2c33;font-size:12.5px;color:var(--tx2)}
.wsm-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm-chip .pt{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.wsm-chip .ico{width:16px;height:16px;flex:none;border-radius:4px}
.wsm-chip.ctx .tx small{font-size:12px;font-weight:500;color:var(--tx3)}
.wsm-chip.ctx .tx{color:var(--tx)}
/* la primera vez: qué es el chip, en una línea tranquila */
.wsm-pista1{padding:0 6px 8px;font-size:12px;line-height:1.4;color:var(--tx3)}
.wsm-chip.sub{opacity:.6}.wsm-chip.mal{border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:#f2a39a}
.wsm .wsm-cx{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--tx3);flex:none}
.wsm .wsm-cx:hover{background:#2e2e35;color:var(--tx)}
.wsm-cx svg{width:12px;height:12px}
.wsm-sin{padding:2px 6px 10px;font-size:13px;line-height:1.45;color:var(--tx2)}
.wsm textarea:disabled{opacity:.5}

/* ---------- soltar un archivo en el monito ---------- */
.wsm.soltar .wsm-nido{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent),0 5px 12px -3px rgba(0,0,0,.36)}

/* ---------- pregunta y permiso: las tarjetas de la página, en chico ---------- */
.wsm-tarjeta{margin-top:8px;padding-top:2px}
.wsm-tarjeta>small{display:block;font-size:12px;font-weight:650;color:var(--tx2);margin-bottom:3px}
.wsm-tarjeta.perm>small{color:var(--warn)}
.wsm-tarjeta p{font-size:14.5px;line-height:1.5;word-wrap:break-word}
.wsm-tarjeta .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.wsm-tarjeta .chip{padding:7px 15px;font-size:13.5px}
.wsm-tarjeta .chip.si{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.wsm-quien{margin-top:9px;font-size:11.5px;color:var(--tx3)}
.wsm-hecho{margin-top:10px;font-size:13px;font-weight:650}
.wsm-hecho.si{color:var(--ok)}.wsm-hecho.no{color:var(--bad)}
details.wsm-det{margin-top:6px}
details.wsm-det summary{display:inline-block;font-size:12px;color:var(--tx3);cursor:pointer;list-style:none}
details.wsm-det summary::-webkit-details-marker{display:none}
details.wsm-det summary:hover{color:var(--tx2)}
details.wsm-det pre{margin-top:6px;white-space:pre-wrap;word-break:break-word;font:11.5px/1.45 var(--mono);color:var(--tx3);background:#18181b;
  border-radius:9px;padding:8px 10px;max-height:140px;overflow:auto}

/* ---------- la barra (⌥ Espacio) ---------- */
.wsm-barra{position:relative;width:min(456px,calc(100vw - 28px));background:var(--panel);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 0 0 .5px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.26),0 8px 18px -12px rgba(0,0,0,.55);padding:9px 9px 8px;transform-origin:100% 100%;animation:wsm-pop .38s var(--rebote) both}
.wsm-barra.sale{animation:wsm-sale .18s var(--sale) forwards}
/* su motor no puede mirar tu pantalla desde el monito (todavía): una línea, sin chip */
.wsm-nomira{padding:0 6px 8px;font-size:12.5px;line-height:1.45;color:var(--tx3)}
/* la marca de «leyó tu pantalla en este turno» en la tarjeta de permiso */
.wsm-leyo{display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:2px 9px 2px 7px;border-radius:999px;
  background:color-mix(in srgb,var(--warn) 12%,#1d1d21);border:1px solid color-mix(in srgb,var(--warn) 30%,#2c2c33);
  font-size:11.5px;font-weight:600;color:color-mix(in srgb,var(--warn) 75%,#fff)}
.wsm-leyo .ojo{flex:none;fill:currentColor;shape-rendering:crispEdges}
.wsm-ags{display:flex;gap:3px;padding:0 2px 8px;overflow-x:auto;scrollbar-width:none}
.wsm-ags::-webkit-scrollbar{display:none}
.wsm-ag{display:flex;align-items:center;gap:7px;height:40px;padding:0 8px 0 6px;border-radius:999px;color:var(--tx2);font-size:13px;font-weight:650;
  flex:none;transition:background-color .15s,color .15s}
.wsm-ag:hover{background:#222226;color:var(--tx)}
.wsm-ag.on{background:var(--card2);color:var(--tx);padding-right:13px}
.wsm-ag span{display:none;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wsm-ag.on span{display:inline}
.wsm-caja{display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1px solid #2b2b31;border-radius:16px;padding:7px 7px 7px 14px;
  transition:border-color .15s}
.wsm-caja:focus-within{border-color:#3a3a42}
/* la caja crece hasta 5 renglones (22 pt cada uno) y luego se recorre, sin barra */
.wsm-caja textarea{flex:1;min-width:0;height:28px;max-height:116px;font-size:15px;line-height:22px;padding:3px 0;-webkit-user-select:text;user-select:text;
  overflow-y:hidden;scrollbar-width:none}
.wsm-caja textarea.tope{overflow-y:auto}
.wsm-caja textarea::-webkit-scrollbar{display:none}
/* el sitio del micrófono (bloque V): entre el texto y «Mandar»; vacío no ocupa lugar */
.wsm-mic{flex:none;display:flex;align-items:center;min-height:34px}
.wsm-mic:empty{display:none}
.wsm-caja textarea::placeholder{color:var(--tx3)}
.wsm .wsm-send{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--acx);flex:none;
  transition:transform .2s var(--ease),opacity .15s}
.wsm .wsm-send:hover{transform:scale(1.06)}
.wsm .wsm-send:disabled{opacity:.3;transform:none;cursor:default}
.wsm-pie{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;padding:7px 6px 0;font-size:11.5px;color:var(--tx3)}
.wsm-pie kbd{font:650 10.5px var(--sans);padding:1px 5px;border-radius:5px;border:1px solid #33333a;color:var(--tx2)}

/* ---------- señalar (F1): el anillo y su etiqueta, encima de lo que enseña ---------- */
.wsm-anillo{position:absolute;z-index:19;border-radius:10px;pointer-events:none;animation:wsm-pop .3s var(--rebote) both,wsm-pulso 1.3s ease-in-out .3s infinite}
.wsm-anillo.sale{animation:wsm-sale .2s var(--sale) forwards}
.wsm-etq{position:absolute;z-index:19;padding:4px 10px;border-radius:999px;background:var(--c);color:var(--acx);font:650 12.5px/1.4 var(--sans);
  white-space:nowrap;pointer-events:none;animation:wsm-pop .35s var(--rebote) .1s both}
.wsm-etq.sale{animation:wsm-sale .2s var(--sale) forwards}

/* ---------- hacia dónde abre: el nido a la izquierda (abre a la derecha) o arriba (abre hacia abajo) ---------- */
.wsm.izq{right:auto;left:14px;align-items:flex-start}
.wsm.izq .wsm-globo{border-bottom-right-radius:20px;border-bottom-left-radius:8px;transform-origin:0 100%}
.wsm.izq .wsm-barra{transform-origin:0 100%}
.wsm.izq .wsm-pista{right:auto;left:calc(100% + 10px);transform:translateX(-6px)}
.wsm.izq .wsmm{align-items:flex-start}
.wsm.arriba{bottom:auto;top:14px;flex-direction:column-reverse}
.wsm.arriba{--dy:-1}
.wsm.arriba .wsm-globo{border-bottom-right-radius:20px;border-top-right-radius:8px;transform-origin:100% 0}
.wsm.arriba.izq .wsm-globo{border-top-right-radius:20px;border-top-left-radius:8px;transform-origin:0 0}
.wsm.arriba .wsm-barra{transform-origin:100% 0}
.wsm.arriba.izq .wsm-barra{transform-origin:0 0}
.wsm.arriba .wsmm{flex-direction:column-reverse}

/* ---------- reducir movimiento: aparece y desaparece, sin moverse ---------- */
@media (prefers-reduced-motion:reduce){
  .wsm-globo,.wsm-barra,.wsm-globo.sale,.wsm-barra.sale,.wsm .entra,.wsm-ext.entra>*,.wsm-anillo,.wsm-etq{animation:none!important}
  .wsm-nido,.wsm>.wsm-globo,.wsm>.wsm-barra,.wsm>.wsmm{transition:none!important}
  .wsm-nido:hover,.wsm.arrastrando .wsm-nido,.wsm.agarrado .wsm-nido{transform:none}
}

/* ===== la conversación de la burbuja (escritorio UX, 22-nov) =====
   Una sola plática por agente: lo de antes arriba (se recorre), lo tuyo, su respuesta y sus archivos. El encabezado dice
   con quién y en qué conversación estás, y lleva «Seguir en la página». Debajo, fijos: lo que te pide (permiso o
   pregunta) o la línea corta de tu respuesta, lo que está haciendo («Haciendo: …») y [Responder] [Copiar].
   Su gesto de trabajo lo hace su cuerpo (20_escritorio.js: trabajo()); con «reducir movimiento» solo quedan sus
   puntitos quietos. */
/* C1 (ronda 2): sin barra de scroll. La caja la desvanece arriba y abajo SOLO del lado donde hay más, una rayita
   de 3 pt aparece mientras recorres y se va sola, y «↓ Lo nuevo» sale si llega algo mientras estás arriba */
.wsm-conv-caja{position:relative;flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
.wsm-conv{flex:0 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;scrollbar-width:none;
  --arr:#000;--aba:#000;-webkit-mask-image:linear-gradient(to bottom,var(--arr) 0,#000 26px,#000 calc(100% - 26px),var(--aba) 100%);
  mask-image:linear-gradient(to bottom,var(--arr) 0,#000 26px,#000 calc(100% - 26px),var(--aba) 100%)}
.wsm-conv::-webkit-scrollbar{display:none;width:0;height:0}
.wsm-conv-caja.mas-arriba>.wsm-conv{--arr:transparent}
.wsm-conv-caja.mas-abajo>.wsm-conv{--aba:transparent}
.wsm-raya{position:absolute;right:1px;top:0;width:3px;height:18px;border-radius:3px;background:var(--tx2);opacity:0;pointer-events:none;
  transition:opacity .45s ease-out}
.wsm-raya.ve{opacity:.55;transition:opacity .12s}
.wsm .wsm-nuevo{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:2;padding:6px 14px;border-radius:999px;
  background:#b9a3ff;color:#16131f;font-size:12.5px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.4);
  animation:wsm-entra .22s var(--ease) both}
.wsm .wsm-nuevo:hover{background:#cbbaff}
/* la plática es lo que se encoge y se recorre (lo de abajo —lo que te pide algo, «Haciendo», [Responder]— queda a la
   vista); si aun así no cabe, la burbuja entera se recorre (14_entregas.css) */
.wsm-globo>.wsm-conv-caja{flex-shrink:1;min-height:4.5em}
.wsm-conv>*{flex-shrink:0}
.wsm-conv .wsm-txt{overflow:visible}
.wsm-conv>.wsm-tu{flex:none}
.wsm-globo>.wsm-tarjeta,.wsm-globo>.wsm-listo,.wsm-globo>.wsm-pasos,.wsm-globo>.wsm-lic,.wsm-globo>.wsm-sigue,.wsm-globo>.wsm-uso{flex:none}

/* el encabezado: «Luna · esta conversación» … «Seguir en la página» */
.wsm-cab{flex-wrap:wrap;row-gap:0;padding-right:58px}
.wsm-cab .conv{color:var(--tx3);font-size:12px;white-space:nowrap}
.wsm-cab .estado{margin-left:2px;white-space:nowrap}
.wsm-cab .br{flex-basis:100%;height:0}
.wsm .wsm-ir.wsm-ir-cab{margin:-1px 0 2px 10px;padding:1px 6px 1px 6px;font-size:11.5px;white-space:nowrap}

/* lo de antes, en chico: tus mensajes a la derecha, los suyos a la izquierda, avisos al centro */
/* C2 (ronda 2): lo tuyo, en globo lavanda a la derecha; lo suyo, a la izquierda, SIN globo y con su carita */
.wsm-hilo{display:flex;flex-direction:column;gap:12px;padding:6px 0 12px}
.wsm-conv{gap:0}
.wsm-conv>.wsm-tu,.wsm-conv>.wsm-ahora,.wsm-conv>.wsm-fila{margin-bottom:12px}
.wsm-h-yo,.wsm-tu{position:relative;align-self:flex-end;max-width:88%;padding:7px 13px;border-radius:16px;border-top-right-radius:6px;
  background:color-mix(in srgb,#b9a3ff 32%,#24242a);font-size:14px;line-height:1.45;color:var(--tx);white-space:pre-wrap;word-wrap:break-word;overflow:visible;
  -webkit-user-select:text;user-select:text}
.wsm-h-yo small{display:block;font-size:11px;font-weight:650;color:color-mix(in srgb,#b9a3ff 60%,#fff);margin-bottom:1px}
.wsm-h-ag{position:relative;align-self:stretch;display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:9px;font-size:14.5px;line-height:1.55;color:var(--tx);word-wrap:break-word}
.wsm-h-ag>.cara{display:block;width:22px;height:22px;margin-top:1px;line-height:0;font-style:normal}
.wsm-h-ag>.cara .mono{filter:none}
.wsm-h-ag>.cu{min-width:0;display:flex;flex-direction:column;-webkit-user-select:text;user-select:text}
.wsm-h-ag.aviso{grid-template-columns:minmax(0,1fr)}.wsm-h-ag.aviso>.cara{display:none}
.wsm-h-ag.aviso .wsm-txt{color:var(--tx2)}
.wsm-h-ag .cu>.wsm-ent,.wsm-h-ag .cu>.wsm-h-arch{margin-top:8px;align-self:flex-start}
.wsm-h-ag .cu>.wsm-ent{align-self:stretch}
.wsm-h-ag .cu>.wsm-ext{margin-top:8px}.wsm-h-ag .cu>.wsm-ext:first-child{margin-top:0}
/* el formato de lo que escribe: párrafos, listas, títulos, código y enlaces */
.wsm-h-ag .tx p,.wsm-txt p{white-space:pre-wrap;margin:0 0 7px}
.wsm-h-ag .tx>:last-child,.wsm-txt>:last-child{margin-bottom:0}
.wsm-h-ag .tx p.tit,.wsm-txt p.tit{font-weight:650;margin-top:2px}
.wsm-h-ag .tx b,.wsm-txt b{font-weight:650;color:var(--tx)}
.wsm-h-ag .tx code,.wsm-txt code{font:12.5px var(--mono);background:#2a2a30;border-radius:5px;padding:1px 5px}
.wsm-h-ag .tx ul,.wsm-h-ag .tx ol,.wsm-txt ul,.wsm-txt ol{margin:0 0 7px;padding-left:21px}
.wsm-h-ag .tx li,.wsm-txt li{margin:2px 0;padding-left:2px}
.wsm-h-ag .tx li.sub,.wsm-txt li.sub{margin-left:16px;list-style-type:circle}
.wsm-h-ag .tx li::marker,.wsm-txt li::marker{color:var(--tx3)}
.wsm-h-ag .tx pre,.wsm-txt pre{margin:2px 0 8px;padding:9px 11px;border-radius:10px;background:#16161a;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
.wsm-enlace{display:inline}
.wsm-enlace .t{margin-right:5px}
.wsm-enlace .dir{font:12px var(--mono);color:var(--tx2);word-break:break-all}
.wsm .wsm-enlace .ir{margin-left:6px;padding:1px 9px;border-radius:999px;border:1px solid #3a3a42;font-size:11.5px;font-weight:650;color:var(--tx2);vertical-align:1px;
  -webkit-user-select:none;user-select:none}
.wsm .wsm-enlace .ir:hover{background:#2a2a30;color:var(--tx)}
.wsm .wsm-enlace .ir:disabled{opacity:.5}
/* C3: lo que hizo, en UNA línea gris que se abre */
.wsm-hizo{margin-top:6px;font-size:12px;color:var(--tx3);-webkit-user-select:none;user-select:none}
.wsm-hizo-caja:empty{display:none}
.wsm .wsm-hizo .linea{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:1px 0;color:var(--tx3);font-size:12px;text-align:left}
.wsm .wsm-hizo .linea:hover{color:var(--tx2)}
.wsm-hizo .linea span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm-hizo .fl{flex:none;width:0;height:0;border-left:5px solid currentColor;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;transition:transform .15s}
.wsm-hizo.abierta .fl{transform:rotate(90deg)}
.wsm-hizo .cuales{margin:4px 0 2px 11px;padding-left:9px;border-left:1px solid #2c2c33;white-space:pre-wrap;line-height:1.5;-webkit-user-select:text;user-select:text}
/* la hora, solo al pasar el ratón; entre días, su separador */
.wsm-hilo>[data-hora]::after{content:attr(data-hora);position:absolute;top:50%;right:calc(100% + 7px);transform:translateY(-50%);font-size:11px;font-weight:500;
  color:var(--tx3);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.wsm-hilo>.wsm-h-ag[data-hora]::after{top:2px;right:0;transform:none;padding:1px 0 1px 9px;background:var(--card)}
.wsm-hilo>[data-hora]:hover::after{opacity:1}
.wsm-dia{align-self:center;padding:2px 11px;border-radius:999px;background:#26262c;font-size:11px;font-weight:650;color:var(--tx3)}
.wsm-conv>.wsm-dia{margin-bottom:12px}
/* buscar en la plática: los mensajes que lo dicen, y en cuál vas */
.wsm-hilo>.wsm-h-ag.halla{padding:3px 6px 3px 9px;border-radius:8px;box-shadow:inset 3px 0 0 0 color-mix(in srgb,#b9a3ff 50%,transparent)}
.wsm-hilo>.wsm-h-ag.halla.ahi{box-shadow:inset 3px 0 0 0 #b9a3ff;background:color-mix(in srgb,#b9a3ff 10%,transparent)}
.wsm-hilo>.wsm-h-yo.halla{box-shadow:0 0 0 1.5px color-mix(in srgb,#b9a3ff 55%,transparent)}
.wsm-hilo>.wsm-h-yo.halla.ahi{box-shadow:0 0 0 2px #b9a3ff}
/* lo que pasó con un enlace: una línea que se va sola */
.wsm-nota-linea{flex:none;margin-top:6px;font-size:12px;line-height:1.4;color:var(--ok)}
.wsm-nota-linea.mal{color:var(--warn)}
.wsm .wsm-h-arch{display:inline-flex;align-items:center;gap:6px;margin-top:5px;max-width:100%;padding:3px 10px 3px 7px;border-radius:999px;
  background:#202024;border:1px solid #2c2c33;font-size:12px;color:var(--tx2)}
.wsm .wsm-h-arch:hover{border-color:#3a3a42;color:var(--tx)}
.wsm-h-arch svg{width:13px;height:13px;flex:none}
.wsm-h-arch span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm-h-nota{align-self:center;font-size:11.5px;color:var(--tx3);text-align:center;padding:0 10px}
.wsm .wsm-h-mas{align-self:center;font-size:11.5px;color:var(--tx3);padding:2px 8px;border-radius:999px}
.wsm .wsm-h-mas:hover{background:#26262c;color:var(--tx2)}

/* lo que mandaste mientras trabajaba */
.wsm-fila{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.wsm-fila-nota{align-self:flex-end;font-size:11.5px;color:var(--tx3)}

/* tu clic en un permiso: la tarjeta se va y queda una línea corta, que se va sola */
.wsm-listo{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px;font-weight:600;color:var(--tx2)}
.wsm-listo .ok{width:16px;height:16px;flex:none;border-radius:50%;background:var(--ok);position:relative}
.wsm-listo .ok::after{content:"";position:absolute;left:5px;top:3px;width:4px;height:7px;border:solid #12301c;border-width:0 2px 2px 0;transform:rotate(45deg)}
.wsm-listo.no .ok{background:#4a4a52}.wsm-listo.no .ok::after{border-color:#d8d8de}
.wsm-listo.fue .ok{background:#3a3a42}.wsm-listo.fue .ok::after{border-color:#9a9aa4}
.wsm-tarjeta .chip.grupo{font-size:13px}
.wsm-grupo{margin-top:7px;font-size:11.5px;line-height:1.4;color:var(--tx3)}
.wsm .wsm-listo.entra,.wsm .tras.entra{animation-delay:.14s}


/* «Haciendo: …» en una línea */
.wsm-pasos .hace{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm-pasos .barras+small+.hace{margin-top:3px}

/* lo que hizo con el permiso que diste para este trabajo */
.wsm-lic{margin-top:8px;padding:7px 10px;border-radius:11px;background:#1d1d21;border:1px solid #2c2c33}
.wsm-lic b{display:block;font-size:12px;font-weight:650;color:var(--tx2)}
.wsm-lic small{display:block;margin-top:2px;font-size:11.5px;color:var(--tx3)}

/* [Responder] */
.wsm .wsm-ir.wsm-responder{color:var(--tx);background:#26262c;padding:4px 8px 4px 12px}
.wsm .wsm-ir.wsm-responder:hover{background:#303038}
.wsm-sigue{gap:6px}

/* la barra: tu respuesta a una entrega va como «Pedir cambios» (o «Solo platicar») */
.wsm-sobre{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 4px 8px;font-size:12px;color:var(--tx3)}
.wsm-sobre span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm-sobre .chip{padding:3px 11px;font-size:12px}
.wsm-sobre .chip:not(.on){opacity:.75}
.wsm-version{padding:2px 6px 10px;font-size:12.5px;line-height:1.45;color:var(--warn)}

@media (prefers-reduced-motion:reduce){
  .wsm .wsm-hilo,.wsm .wsm-fila.entra,.wsm .wsm-listo.entra,.wsm .wsm-lic.entra,.wsm .wsm-nuevo,.wsm-nota-linea.entra{animation:none!important}
  .wsm-raya,.wsm-hilo>[data-hora]::after,.wsm-hizo .fl{transition:none!important}
}

/* ===== las manos en la burbuja: tarjeta de permiso de la Mac y ojito (parte de la burbuja: 25_manos.js) =====
   Con las variables y los botones (.chip) de la página; el color lo pone el personaje (--c), la interfaz va en grises.
   Entra con resorte; lo pixel (candado, ojo, puntitos de espera) va en escalón. */
.wsmm{display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
.wsmm:empty{display:none}
.wsmm>*{pointer-events:auto}
.wsmm-tarjeta{position:relative;width:min(356px,calc(100vw - 28px));background:var(--card);border:1px solid var(--line);border-radius:20px;
  border-bottom-right-radius:8px;box-shadow:0 0 0 .5px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.26),0 8px 18px -12px rgba(0,0,0,.55);padding:12px 15px 13px;transform-origin:100% 100%;
  font:14.5px/1.5 var(--sans);color:var(--tx);animation:wsmm-pop .44s cubic-bezier(.2,.9,.25,1.15) both}
.wsmm-tarjeta.sale{animation:wsmm-sale .24s steps(5) forwards;pointer-events:none}
.wsmm-cab{display:flex;align-items:center;gap:8px;min-height:24px;padding-right:26px;font-size:12.5px;color:var(--tx3)}
.wsmm-cab b{color:var(--warn);font-weight:650;font-size:12.5px}
.wsmm-ico{flex:none;fill:var(--warn);shape-rendering:crispEdges}
.wsmm-ico .hueco{fill:var(--card)}
.wsmm-tarjeta.gracias .wsmm-cab b{color:var(--ok)}
.wsmm-tarjeta.gracias .wsmm-ico{fill:var(--ok)}
.wsmm-x{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--tx3);
  font:400 19px/1 var(--sans);background:none;border:0;cursor:pointer}
.wsmm-x:hover{background:#2a2a30;color:var(--tx)}
.wsmm-txt{margin-top:6px;font-size:14.5px;line-height:1.5;word-wrap:break-word}
.wsmm-nota{display:block;margin-top:5px;font-size:12px;color:var(--tx3)}
.wsmm-nota:empty{display:none}
.wsmm-tarjeta .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.wsmm-tarjeta .chips:empty{display:none}
.wsmm-tarjeta .chip{padding:7px 15px;font-size:13.5px}
.wsmm-pts{display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px}
.wsmm-pts i{width:4px;height:4px;background:var(--tx2);animation:wsmm-pt 1.2s steps(2) infinite}
.wsmm-pts i:nth-child(2){animation-delay:.2s}.wsmm-pts i:nth-child(3){animation-delay:.4s}
@keyframes wsmm-pt{50%{opacity:.2}}

/* el ojito: una píldora chica junto al nido mientras mira */
.wsmm-ojo{display:flex;align-items:center;gap:8px;height:32px;padding:0 13px 0 10px;border-radius:999px;background:var(--card);
  border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:0 2px 6px rgba(0,0,0,.26),0 6px 16px -8px rgba(0,0,0,.5),0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent);
  font:650 12.5px/1 var(--sans);color:var(--tx);white-space:nowrap;transform-origin:100% 50%;animation:wsmm-pop .38s cubic-bezier(.2,.9,.25,1.15) both}
.wsmm-ojo.sale{animation:wsmm-sale .24s steps(5) forwards}
.wsmm-ojo-svg{flex:none;fill:var(--c);shape-rendering:crispEdges;animation:wsmm-parpadea 3.2s steps(1) infinite}
.wsmm-ojo-svg .pupila{animation:wsmm-mira 2.4s steps(4) infinite alternate}
@keyframes wsmm-mira{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
@keyframes wsmm-parpadea{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.15)}}
.wsmm-ojo-svg{transform-origin:50% 50%}

@keyframes wsmm-pop{0%{opacity:0;transform:translateY(12px) scale(.6)}60%{opacity:1;transform:translateY(0) scale(1.06)}100%{opacity:1;transform:none}}
@keyframes wsmm-sale{from{clip-path:inset(0 0 0 0);opacity:1}to{clip-path:inset(100% 0 0 0);opacity:0}}
@media (prefers-reduced-motion:reduce){.wsmm-tarjeta,.wsmm-ojo,.wsmm-ojo-svg,.wsmm-ojo-svg .pupila,.wsmm-pts i{animation:none!important}}

/* ===== actuar en la burbuja (A0): el interruptor de la barra y la pastilla de avance (26_actuar.js). El aviso
   tranquilo con Deshacer va en el globito del toque (14_entregas.css: .wsm-toque .in.largo, el ensayo en lavanda). La
   tarjeta de OK no vive aquí: la arma la app. Mismas variables y botones (.chip) que la página. ===== */
.wsma-modo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:2px 4px 6px;font-size:12px;color:var(--tx3)}
.wsma-modo-t{margin-right:2px}
.wsma-op{padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--tx2);
  font:500 12px/1.4 var(--sans);cursor:pointer}
.wsma-op:hover{background:#2a2a30;color:var(--tx)}
.wsma-op.on{background:var(--tx);color:var(--bg,#151518);border-color:var(--tx)}
.wsma-pastilla{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 13px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font:500 12.5px/1.4 var(--sans);color:var(--tx2);animation:wsmm-pop .36s cubic-bezier(.2,.9,.25,1.15) both}
.wsma-pastilla .chip{padding:3px 10px;font-size:12px}
.wsma-pastilla.sale{animation:wsmm-sale .24s steps(5) forwards}
@media (prefers-reduced-motion:reduce){.wsma-pastilla{animation:none}}

/* ===== E1 · entregas en la burbuja (27_entregas.js) =====
   Con las variables y los botones (.chip) de la página; el color lo pone el personaje (--c), la interfaz va en grises y
   cada tipo de archivo trae su color en su etiqueta (--e). Entrar y salir es de la clase de cada pieza (.entra, .sale);
   cambiar de alto lo desliza `acomodar`. Con «reducir movimiento», nada se mueve. */

/* ---------- la tarjeta de una entrega ---------- */
.wsm-ent{display:flex;flex-direction:column;gap:9px;padding:9px;border-radius:16px;background:#1d1d21;border:1px solid #2c2c33}
.wsm-ent-arr{display:grid;grid-template-columns:1fr;gap:8px;cursor:grab;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.wsm.sacando .wsm-ent-arr{cursor:grabbing}
.wsm-ent-mini{--e:#6b6b78;position:relative;height:96px;border-radius:11px;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(160deg,color-mix(in srgb,var(--e) 22%,#232328),#1a1a1e);border:1px solid #2e2e35}
.wsm-ent-mini.foto{background:#f4f4f6;border-color:#3a3a42}
.wsm-ent-mini img{max-width:100%;max-height:100%;object-fit:contain;display:block;-webkit-user-drag:none;pointer-events:none}
/* una página (Word, PDF): su parte de arriba, a lo ancho (el título y lo primero se leen); una lámina, entera */
.wsm-ent-mini.foto img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;object-position:50% 0}
.wsm-ent-mini.foto.ancha img{object-fit:contain;object-position:50% 50%}
.wsm-ent-mini:not(.foto) img{width:56px;height:56px}
.wsm-ent-mini .ext{position:absolute;left:8px;bottom:8px;padding:2px 6px;border-radius:5px;background:var(--e);color:#fff;
  font:800 10.5px/1.2 var(--sans);letter-spacing:.04em}
.wsm-ent-mini:not(.foto) .ext:only-child{position:static;font-size:13px;padding:5px 9px}
.wsm-ent .tx{min-width:0;padding:0 3px}
.wsm-ent .tx b{display:block;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm-ent .tx small{display:block;margin-top:1px;color:var(--tx3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm-ent>.chips{display:flex;flex-wrap:wrap;gap:6px}
.wsm-ent .chip{padding:5px 11px;font-size:12.5px}
.wsm-ent .wsm-mas{min-width:34px;padding:5px 9px;letter-spacing:.08em}
.wsm-ent-pista{position:absolute;top:7px;right:7px;padding:2px 8px;border-radius:999px;background:rgba(20,20,24,.78);color:#d6d6de;
  font-size:11px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .15s}
.wsm-ent-arr:hover .wsm-ent-pista{opacity:1}
.wsm-ent-pista[hidden]{display:none}

/* los menús de la tarjeta y de la barra: dentro de la burbuja (se deslizan), no capas encima */
.wsm-ent-menu,.wsm-menub{display:flex;flex-direction:column;gap:2px;padding:5px;border-radius:12px;background:#18181b;border:1px solid #2c2c33}
.wsm-menub{margin:0 2px 8px}
.wsm .wsm-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;padding:7px 10px;border-radius:8px;text-align:left;
  transition:background-color .12s}
.wsm .wsm-item:hover{background:#26262c}
.wsm .wsm-item.on{background:color-mix(in srgb,var(--c) 14%,#202024)}
.wsm-item span{font-size:13px;font-weight:600;color:var(--tx)}
.wsm-item small{font-size:11.5px;color:var(--tx3)}
.wsm-sep{padding:6px 10px 3px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.wsm-in{width:100%;height:32px;margin:4px 0 2px;padding:0 10px;border-radius:9px;background:#202024;border:1px solid #2e2e35;color:var(--tx);
  font:13px var(--sans);outline:0;-webkit-user-select:text;user-select:text}
.wsm-in:focus{border-color:#3d3d46}
.wsm-ent-menu .chips,.wsm-menub .chips{display:flex;gap:6px;margin-top:6px}
.wsm-ags-p{display:flex;flex-wrap:wrap;gap:4px;padding:2px 4px}
.wsm .wsm-ag-p{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 5px;border-radius:999px;color:var(--tx2);font-size:12.5px;font-weight:650;
  transition:background-color .12s}
.wsm .wsm-ag-p:hover{background:#222226}
.wsm .wsm-ag-p.on{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
.wsm-vacio{display:block;padding:6px 10px;font-size:12.5px;color:var(--tx3)}
.wsm-ok{display:block;padding:4px 2px;font-size:12.5px;color:var(--ok)}
.wsm-mal{display:block;padding:4px 2px;font-size:12.5px;color:#f2a39a}

/* «Pedir cambios» y la versión que se está haciendo */
.wsm-ent-cambios{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 2px 0}
.wsm-ent-cambios>small{margin-right:2px;font-size:11.5px;color:var(--tx3)}
.wsm-ent-cambios .chip{padding:4px 10px;font-size:12px}
.wsm-ent-cambios .wsm-in{flex:1;min-width:140px;margin:0}
.wsm-ent-hace{padding:0 3px}
.wsm-ent-hace small,.wsm-enc .wsm-pasos small{display:block;margin-top:6px;font-size:12px;color:var(--tx2)}
.wsm-encs .barras,.wsm-ent-hace .barras{display:flex;gap:4px}
.wsm-encs .barras b,.wsm-ent-hace .barras b{flex:1;height:5px;border-radius:999px;background:color-mix(in srgb,var(--c) 20%,#2a2a30)}
.wsm-encs .barras b.h,.wsm-ent-hace .barras b.h{background:var(--c)}
.wsm-encs .barras b.a,.wsm-ent-hace .barras b.a{background:var(--c);animation:lat 1s ease-in-out infinite}
.barras.quieto b{opacity:.6}

/* ---------- las tarjetas de encargo (la propuesta de la app y su avance) ---------- */
.wsm-encs{display:flex;flex-direction:column;gap:9px;margin-top:9px}
.wsm-enc{position:relative;display:flex;flex-direction:column;gap:7px;padding:11px 12px 12px;border-radius:16px;background:#1b1b1f;border:1px solid #2c2c33}
.wsm-enc.necesita{border-color:color-mix(in srgb,var(--warn) 40%,#2c2c33)}
.wsm-enc .cab{display:flex;align-items:center;gap:8px;min-height:22px;padding-right:24px;font-size:12px;color:var(--tx3)}
.wsm-enc .cab b{color:var(--tx);font-size:13px;font-weight:650}
.wsm-enc.prop .cab b{color:var(--warn)}
.wsm-enc .cab .ico{flex:none;fill:var(--warn);shape-rendering:crispEdges}
.wsm-enc .cab .pt,.wsm-toque .pt,.wsm-grande .fila .pt{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.wsm-enc .cab .est{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm-enc .cab .wsm-cx{position:absolute;top:8px;right:8px}
.wsm-enc .quien,.wsm-enc .titulo,.wsm-enc .pide,.wsm-enc .res{font-size:14px;line-height:1.45}
.wsm-enc .titulo{font-weight:650}
.wsm-enc .pedido{padding:7px 11px;border-left:3px solid var(--c);border-radius:4px 10px 10px 4px;background:#222227;font-size:13.5px;line-height:1.45;
  color:var(--tx)}
.wsm-enc .filas{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;align-items:baseline;font-size:12.5px}
.wsm-enc .filas .k{color:var(--tx3)}
.wsm-enc .filas .v b{font-weight:600;color:var(--tx)}
.wsm-enc .filas .v small{display:block;color:var(--tx3);font-size:11.5px}
.wsm-enc .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.wsm-enc .chip{padding:6px 13px;font-size:13px}
.wsm-enc .nota{font-size:11.5px;line-height:1.4;color:var(--tx3)}

/* ---------- el número del nido y el globito del toque ---------- */
.wsm-insignia{position:absolute;top:8px;right:8px;z-index:4;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;
  background:var(--c);color:var(--acx);font:800 11.5px/1 var(--sans);box-shadow:0 0 0 3px var(--rail)}
.wsm-insignia.entra{animation:wsm-pop .42s var(--rebote) both}
.wsm-insignia.sale{animation:wsm-sale .2s var(--sale) forwards}
.wsm-toque{position:absolute;right:124px;bottom:30px;z-index:6;pointer-events:auto;animation:wsm-pop .42s var(--rebote) both;transform-origin:100% 50%}
.wsm-toque.sale{animation:wsm-sale .22s var(--sale) forwards;pointer-events:none}
.wsm-toque .in{display:flex;align-items:center;gap:10px;max-width:300px;padding:8px 8px 8px 13px;border-radius:999px;background:var(--card);
  border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:0 2px 6px rgba(0,0,0,.26),0 6px 16px -8px rgba(0,0,0,.5),0 0 0 3px color-mix(in srgb,var(--c) 12%,transparent)}
.wsm-toque .tx{min-width:0;line-height:1.25}
.wsm-toque .tx b{display:block;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm-toque .tx small{display:block;font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm-toque .chip{padding:5px 13px;font-size:12.5px}
.wsm-toque .wsm-cx{margin-left:-4px}
.wsm-toque .chips{display:flex;gap:6px;flex:none}
/* el aviso tranquilo de actuar (A0) en el mismo globito: su texto se parte en renglones y sus botones van abajo */
.wsm-toque .in.largo{flex-wrap:wrap;align-items:flex-start;gap:8px 10px;width:min(330px,calc(100vw - 150px));max-width:none;border-radius:18px;padding:10px 10px 10px 13px}
.wsm-toque .in.largo .pt{margin-top:5px}
.wsm-toque .in.largo .tx{flex:1 1 0}
.wsm-toque .in.largo .tx small{white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;font-size:12.5px;color:var(--tx2)}
.wsm-toque .in.largo .chips{order:3;width:100%;padding-left:18px}
.wsm-toque .in.largo .chips:empty{display:none}
.wsm-toque .in.ensayo{border-color:rgba(185,163,255,.55)}
.wsm.izq .wsm-toque{right:auto;left:124px;transform-origin:0 50%}
.wsm.arriba .wsm-toque{bottom:auto;top:30px}

/* ---------- los botones de la barra según lo que tienes enfrente ---------- */
.wsm-botones{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px 8px}
.wsm .wsm-bt{height:30px;padding:0 12px;border-radius:999px;background:#202024;border:1px solid #2c2c33;font-size:12.5px;font-weight:600;color:var(--tx2);
  transition:background-color .12s,color .12s,border-color .12s}
.wsm .wsm-bt:hover{background:#26262c;color:var(--tx);border-color:#36363e}

/* ---------- el botón ⤢ de la burbuja, [Copiar] y la línea chica de «hecho» ---------- */
.wsm .wsm-gr{right:38px;font-size:15px;line-height:1}
.wsm-sigue{gap:4px}
.wsm-hecho-t{display:block;margin-top:8px;font-size:12px;color:var(--ok)}
.wsm-hecho-t.entra{animation:wsm-entra .26s var(--ease) both}

/* ---------- el chat grande (⤢): el MISMO chat, en grande (ronda 2, bloque G) ----------
   tira de agentes · (encabezado, buscar, la plática y la caja de escribir de la burbuja) · «Te esperan» y «Entregas».
   Junto al nido (G-1: una app de antes, el boceto) es una caja angosta; en su propia ventana (G-2: html.wsm-ventana)
   la llena y cambia de tamaño con ella. */
.wsm>.wsm-grande{flex:0 1 auto;min-height:0}
.wsm-grande{position:relative;width:min(442px,calc(100vw - 28px));height:min(860px,calc(100vh - 170px));display:flex;
  background:var(--card);border:1px solid var(--line);border-radius:20px;border-bottom-right-radius:8px;box-shadow:0 0 0 .5px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.26),0 8px 18px -12px rgba(0,0,0,.55);
  transform-origin:100% 100%;animation:wsm-pop .42s var(--rebote) both;overflow:hidden}
.wsm-grande.sale{animation:wsm-sale .22s var(--sale) forwards;pointer-events:none}
/* la tira: tus agentes, con su monito y su número si algo te espera */
.wsm-grande .tira{flex:none;width:88px;display:flex;flex-direction:column;gap:5px;padding:12px 8px;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;scrollbar-width:none}
.wsm-grande .tira::-webkit-scrollbar{display:none}
.wsm-grande.una .tira{display:none}
.wsm .wsm-grande .tira .ag{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border-radius:14px;
  font-size:12px;font-weight:650;color:var(--tx3);transition:background-color .15s,color .15s}
.wsm .wsm-grande .tira .ag:hover{background:#222226;color:var(--tx)}
.wsm .wsm-grande .tira .ag.on{background:var(--card2);color:var(--tx)}
.wsm-grande .tira .ag span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsm-grande .n{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#b9a3ff;color:#16131f;font:700 11px/18px var(--sans);text-align:center;font-style:normal}
.wsm-grande .tira .ag .n{position:absolute;top:3px;right:9px}
/* el centro: su encabezado y, debajo, las piezas de la burbuja */
.wsm-grande .centro{position:relative;flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.wsm-grande .gcab{flex:none;display:flex;align-items:center;gap:4px;height:50px;padding:0 10px 0 18px}
.wsm-grande .gcab .nom{font-size:15.5px;font-weight:650;white-space:nowrap}
.wsm-grande .gcab .est{flex:0 1 auto;min-width:0;margin-left:6px;font-style:normal;font-size:12.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm-grande .gcab .asa{flex:1 1 0;align-self:stretch;min-width:0}
/* angosto (junto al nido): todo cabe en el encabezado, sus botones nunca se cortan */
.wsm-grande.angosto .gcab{gap:2px;padding:0 6px 0 14px}
.wsm .wsm-grande.angosto .gcab .gb{min-width:30px;padding:0 5px}
.wsm .wsm-grande.angosto .gcab .gb.gmin{min-width:36px;padding:0 9px;margin-left:2px}
.wsm .wsm-grande.angosto .gcol{padding:0 9px}
.wsm .wsm-grande .gb{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:34px;height:34px;padding:0 8px;border-radius:10px;
  color:var(--tx3);font-size:12px;font-weight:650;transition:background-color .12s,color .12s}
.wsm .wsm-grande .gb:hover{background:#2a2a30;color:var(--tx)}
/* dos controles distintos, con letrero: «⤡ Chico» (cambia de tamaño) y «─ Minimizar» (lo guarda TODO; el que más se usa:
   relleno, al final, en la esquina) */
.wsm .wsm-grande .gb.gchico{padding:0 11px;margin-left:4px}
.wsm .wsm-grande .gb.gmin{min-width:42px;padding:0 13px;margin-left:4px;background:#2c2838;color:#d9ccff}
.wsm .wsm-grande .gb.gmin:hover{background:#b9a3ff;color:#16131f}
.wsm .wsm-grande .gb.hecho{color:var(--ok)}
.wsm .wsm-grande .gcol{flex:none;display:none;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:#26262c;
  font-size:12px;font-weight:650;color:var(--tx2)}
.wsm .wsm-grande .gcol:hover{background:#303038;color:var(--tx)}
.wsm-grande.angosto .gcol{display:inline-flex}
.wsm-grande.angosto .gb span{display:none}
.wsm .wsm-grande.angosto .gcab .gb.gmin .let{display:inline}      /* angosto: «Minimizar» conserva su letrero */
.wsm .wsm-grande.angosto .gcab .gb.gchico{padding:0 5px;margin-left:0}
.wsm-grande .gbusca{flex:none;display:flex;align-items:center;gap:2px;margin:0 14px 8px;padding:3px 4px 3px 13px;border-radius:12px;background:#18181b;border:1px solid #2b2b31}
.wsm-grande .gbusca input{flex:1;min-width:0;height:30px;font:inherit;font-size:13.5px;color:var(--tx);background:none;border:0;outline:0;-webkit-user-select:text;user-select:text}
.wsm-grande .gbusca input::placeholder{color:var(--tx3)}
.wsm-grande .gbusca .cuenta{padding:0 6px;font-size:11.5px;color:var(--tx3);white-space:nowrap}
.wsm .wsm-grande .gbusca .gb{min-width:28px;height:28px;padding:0 4px}
/* las MISMAS piezas de la burbuja, sin su marco: llenan el centro */
.wsm-grande .wsm-globo{flex:1 1 auto;min-height:0;width:auto;max-width:none;max-height:none;background:none;border:0;border-radius:0;box-shadow:none;
  animation:none!important;padding:0 18px 2px;transform:none;overflow:visible}
.wsm-grande .wsm-globo>.wsm-x,.wsm-grande .wsm-globo>.wsm-cab{display:none}
.wsm-grande .wsm-globo>.wsm-conv-caja{flex:1 1 auto;min-height:0}
/* en una ventana muy ancha, la plática no se estira de lado a lado: una columna cómoda de leer, al centro */
.wsm-grande .wsm-conv{flex:1 1 auto;padding:0 max(6px,calc((100% - 800px) / 2))}
.wsm-grande .wsm-hilo{padding-top:10px}
.wsm-grande .wsm-h-yo,.wsm-grande .wsm-tu{max-width:76%}
.wsm-grande .wsm-barra{flex:none;width:auto;background:none;border:0;border-radius:0;box-shadow:none;animation:none!important;transform:none;padding:6px 14px 14px}
.wsm-grande .wsm-barra .wsm-ags,.wsm-grande .wsm-barra .wsm-pie{display:none}
.wsm-grande .wsm-caja{border-radius:18px;padding:9px 9px 9px 16px}
/* la columna: lo que te espera, tus entregas y los encargos */
.wsm-grande .col{flex:none;width:266px;display:flex;flex-direction:column;gap:16px;padding:16px 12px 10px;border-left:1px solid var(--line);overflow-y:auto;
  scrollbar-width:none;overscroll-behavior:contain}
.wsm-grande .col::-webkit-scrollbar{display:none}
.wsm-grande.angosto .col{display:none}
.wsm-grande.angosto.ver-col .col{display:flex;position:absolute;z-index:3;top:50px;right:0;bottom:0;left:88px;width:auto;border-left:0;background:var(--card)}
.wsm-grande.angosto.una.ver-col .col{left:0}
.wsm-grande .col .sec{display:flex;flex-direction:column;gap:7px}
.wsm-grande .col .sec[hidden]{display:none}
.wsm-grande .col .tit{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:var(--tx3)}
.wsm-grande .col .tit:not(:first-child){margin-top:8px}
.wsm-grande .col .fichas{display:flex;flex-direction:column;gap:7px}
.wsm-grande .col .fichas:empty{display:none}
.wsm-grande .espera{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 9px;padding:10px 12px 11px;border-radius:14px;background:#1d1d21;border:1px solid #2c2c33}
.wsm-grande .espera.pide{border-color:color-mix(in srgb,#b9a3ff 45%,#2c2c33)}
.wsm-grande .espera .pt{width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--c)}
.wsm-grande .espera .tx b{display:block;font-size:13px;font-weight:650}
.wsm-grande .espera .tx small{display:block;font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
.wsm-grande .espera .chips{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.wsm-grande .espera .chip{padding:5px 14px;font-size:12.5px}
.wsm-grande .wsm-vacio{font-size:12px;line-height:1.4;color:var(--tx3)}
.wsm-grande .fila{display:flex;align-items:center;gap:9px;padding:8px;border-radius:12px;background:#1d1d21;border:1px solid #2a2a30}
.wsm-grande .fila .wsm-ent-arr{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.wsm-grande .fila .wsm-ent-mini.chica,.wsm-grande .fila .wsm-ent-mini{flex:none;width:44px;height:36px;border-radius:8px}
.wsm-grande .fila .wsm-ent-mini .ext{position:static;font-size:9px;padding:2px 4px}

    var barras = el('i', 'wsmv-barras'); for (var k = 0; k < 5; k++) barras.appendChild(el('i')); b.appendChild(barras);
    b.hidden = true;
    var antes = o.antes || null;                               /* de fábrica, antes del botón de mandar de la caja */
    for (var h = 0; !antes && h < m.caja.children.length; h++) if (m.caja.children[h].classList.contains('wsm-send')) antes = m.caja.children[h];
    if (antes && antes.parentNode === m.caja) m.caja.insertBefore(b, antes); else m.caja.appendChild(b);

    m.tarjeta = el('div', 'wsmv-tarjeta'); m.tarjeta.hidden = true;
    m.caja.parentNode.insertBefore(m.tarjeta, m.caja);
    m.pie = el('div', 'wsmv-pie'); m.pie.hidden = true;
    m.caja.parentNode.insertBefore(m.pie, m.caja.nextSibling);
    if (m.nido) { m.onda = el('div', 'wsmv-onda'); for (var j = 0; j < 7; j++) m.onda.appendChild(el('i')); m.nido.appendChild(m.onda); }
    b.onclick = function () { if (S.fase === 'reposo') A = m; host({ op: 'voz_tocar' }); m.ta.focus(); };
    /* si escribes mientras dictas, lo tuyo se queda: lo dictado sigue después */
    m.ta.addEventListener('input', function () {
      if (S.mio || A !== m || (S.fase !== 'oyendo' && S.fase !== 'escribiendo')) return;
      S.base = m.ta.value; S.corte = S.ultimo.length;
    });
    /* Enter manda lo que hay (lo manda la caja, no esta pieza): el micrófono se apaga y ya no cae más texto */
    m.ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && A === m && (S.fase === 'oyendo' || S.fase === 'escribiendo')) {
        S.fase = 'reposo'; host({ op: 'voz_cancelar' }); pintar({ fase: 'reposo' });
      }
    }, true);
    /* la barra se cierra: el micrófono también */
    var barra = m.caja.closest ? m.caja.closest('.wsm-barra') : null;
    if (barra && typeof MutationObserver !== 'undefined') {
      new MutationObserver(function () { if (barra.hidden && A === m && S.fase !== 'reposo') host({ op: 'voz_cancelar' }); })
        .observe(barra, { attributes: true, attributeFilter: ['hidden'] });
    }
    M.push(m);
    if (!A) A = m;
    if (S.app) b.hidden = false; else saludar(0);
    return b;
  }

  /* la app tarda un momento en presentarse (WSM.app): se le pregunta por la voz cuando ya dijo que sabe */
  function saludar(n) {
    if (S.app || S.saludo) return;
    if (sabe()) { S.saludo = true; host({ op: 'voz_hola' }); return; }
    if (n < 40) setTimeout(function () { saludar(n + 1); }, 250);
  }

  /* la burbuja del monito: su caja, su textarea y su nido (30_arranque.js, tras WSM.montar) */
  function auto() {
    if (typeof WSM === 'undefined' || !WSM.piezas) return null;
    var R = WSM.piezas();
    if (!R || !R.ta || !R.ta.parentNode) return null;
    return montar({ caja: R.ta.parentNode, ta: R.ta, nido: R.nido, antes: R.send });
  }

  function app(info) {
    S.app = info && typeof info === 'object' ? info : null;
    M.forEach(function (m) { m.b.hidden = !S.app; });
    return !!S.app;
  }

  function boton(txt, op, principal) {
    var b = el('button', 'wsmv-b' + (principal ? ' p' : ''), txt); b.type = 'button';
    b.onclick = function () { host({ op: op }); if (A) A.ta.focus(); };
    return b;
  }

  function tarjeta(m, frase, botones, clase) {
    var t = m.tarjeta; t.textContent = ''; t.className = 'wsmv-tarjeta' + (clase ? ' ' + clase : '');
    if (!frase) { t.hidden = true; return; }
    t.appendChild(el('p', null, frase));
    if (botones && botones.length) { var f = el('div', 'wsmv-botones'); botones.forEach(function (x) { f.appendChild(x); }); t.appendChild(f); }
    t.hidden = false;
  }

  function pintar(o) {
    var m = A; if (!m) return;
    var f = o.fase, oye = f === 'oyendo';
    clearTimeout(S.quitar);
    M.forEach(function (x) {
      var esta = x === m;
      x.b.classList.toggle('on', esta && oye);
      x.b.classList.toggle('espera', esta && (f === 'preparando' || f === 'escribiendo'));
      x.b.title = esta && oye ? 'Terminar de dictar' : 'Dictar';
      x.b.setAttribute('aria-pressed', esta && oye ? 'true' : 'false');
      if (x.nido) x.nido.classList.toggle('wsmv-oye', oye);
      if (!esta) { x.tarjeta.hidden = true; x.pie.hidden = true; }
    });
    m.pie.hidden = !oye;
    if (oye) m.pie.textContent = 'Te escucho. Toca el micrófono' + (S.app && S.app.atajo ? ' o suelta ⌥ Espacio' : '') + ' para terminar; tú lo mandas.';
    if (f === 'aviso') tarjeta(m, o.frase, [boton('Seguir', 'voz_seguir', true), boton('Ahora no', 'voz_no')]);
    else if (f === 'apagado') tarjeta(m, o.frase, [boton('Abrir Ajustes', 'voz_ajustes', true), boton('Cerrar', 'voz_no')]);
    else if (f === 'preparando') {
      var av = +o.avance;
      if (!(av >= 0)) { tarjeta(m, null); S.barraAvance = null; }       /* casi siempre ya está listo: sin tarjeta */
      else {
        if (!S.barraAvance || m.tarjeta.hidden) {
          tarjeta(m, 'Preparando el español de tu Mac para dictar (una sola vez)…');
          var caja = el('div', 'wsmv-avance'); S.barraAvance = el('i'); caja.appendChild(S.barraAvance); m.tarjeta.appendChild(caja);
        }
        S.barraAvance.style.width = Math.round(Math.max(0.03, Math.min(1, av)) * 100) + '%';
      }
    } else if (o.nota) {
      tarjeta(m, o.nota, null, 'nota');
      S.quitar = setTimeout(function () { m.tarjeta.hidden = true; }, 9000);
    } else tarjeta(m, null);
    if (f !== 'preparando') S.barraAvance = null;
  }

  function estado(o) {
    if (!o || !o.fase) return;
    var antes = S.fase;
    if (o.fase === 'preparando' && antes === 'preparando' && +o.avance >= 0) { pintar(o); return; }
    S.fase = o.fase;
    var m = A;
    if (m && o.fase === 'oyendo' && antes !== 'oyendo') { S.base = m.ta.value; S.corte = 0; S.ultimo = ''; nivel(0); }
    pintar(o);
    if (m && o.fase === 'reposo' && (antes === 'oyendo' || antes === 'escribiendo')) {
      m.ta.focus();
      try { m.ta.selectionStart = m.ta.selectionEnd = m.ta.value.length; } catch (e) { }
    }
  }

  /* lo que va oyendo: `firme` ya no cambia, `volatil` todavía sí. Cae en la caja, después de lo que ya tenías. */
  function dictado(o) {
    var m = A;
    if (!m || !o || (S.fase !== 'oyendo' && S.fase !== 'escribiendo')) return;
    S.ultimo = String(o.firme || '') + String(o.volatil || '');
    var v = unir(S.base, S.ultimo.slice(S.corte));
    if (m.ta.value === v) return;
    S.mio = true;
    m.ta.value = v;
    try { m.ta.dispatchEvent(new Event('input', { bubbles: true })); } catch (e) { }
    S.mio = false;
    m.ta.scrollTop = m.ta.scrollHeight;
  }

  function nivel(n) {
    var m = A; if (!m) return;
    n = Math.max(0, Math.min(1, +n || 0));
    m.b.style.setProperty('--n', n);
    if (m.onda) m.onda.style.setProperty('--n', n);
  }

  return { montar: montar, auto: auto, app: app, estado: estado, dictado: dictado, nivel: nivel, unir: unir,
    s: S, cajas: function () { return M; } };
})();

/* La app de la Mac: arma el monito y avisa que está listo (el puente le manda los agentes de Workspace). En el boceto
   no corre: ahí lo arma boceto.js con su escritorio de ejemplo.
   La app contesta con su versión (WSM.app): si no contesta, es una app de antes que esta burbuja y algunos botones no
   le llegarían; la barra lo dice en una línea (en vez de botones que no hacen nada). */
if (document.documentElement.classList.contains('wsm-app')) {
  WSM.montar(document.getElementById('wsm'));
  if (typeof WSMVoz !== 'undefined') WSMVoz.auto();          /* el micrófono de la caja (28_voz.js) */
  try { window.webkit.messageHandlers.ws.postMessage({ op: 'listo' }); } catch (e) { }
  setTimeout(function () { if (!WSM.s.app) WSM.app(null); }, 4000);
}

</script>
